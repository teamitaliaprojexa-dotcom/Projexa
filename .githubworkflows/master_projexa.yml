# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
#
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Projexa

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install, build and test backend
        working-directory: ./backend
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir deploy

          cp -R backend deploy/backend
          cp -R sito deploy/sito

      - name: Verify login configuration
        run: |
          echo "Verifica del login.html che verra pubblicato..."
          echo ""
          grep -n "BACKEND_URL" deploy/sito/login.html
          grep -n "API_URL" deploy/sito/login.html

          if grep -q "projexa-4mix.onrender.com" deploy/sito/login.html; then
            echo ""
            echo "ERRORE:"
            echo "sito/login.html contiene ancora l'URL Render hardcoded."
            echo "Il deployment viene interrotto per evitare di pubblicare il file errato."
            exit 1
          fi

          echo ""
          echo "OK: login.html non contiene URL Render hardcoded."

      - name: Show deployment structure
        run: |
          echo "Struttura del pacchetto:"
          find deploy -maxdepth 2 -type f | head -100

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy

      - name: Verify downloaded artifact
        run: |
          echo "Controllo artifact scaricato..."
          grep -n "BACKEND_URL" ./deploy/sito/login.html
          grep -n "API_URL" ./deploy/sito/login.html

          if grep -q "projexa-4mix.onrender.com" ./deploy/sito/login.html; then
            echo "ERRORE: artifact contiene URL Render hardcoded."
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A4AE537E6C44DB597DECEEE602DE6AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_34973296802445539B8721434FACAC40 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A91E13BECF9846E4B1CCF1CD0B54E076 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Projexa'
          slot-name: 'Production'
          package: ./deploy