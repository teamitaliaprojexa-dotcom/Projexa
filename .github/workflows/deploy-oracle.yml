name: Deploy Projexa su Oracle Cloud

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura chiave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_oracle
          chmod 600 ~/.ssh/id_oracle
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Copia backend e sito sulla VM
        run: |
          RSYNC_SSH="ssh -i ~/.ssh/id_oracle"
          TARGET="${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/opt/projexa"
          rsync -az --delete -e "$RSYNC_SSH" --exclude node_modules --exclude .env ./backend/ "$TARGET/backend/"
          rsync -az --delete -e "$RSYNC_SSH" ./sito/ "$TARGET/sito/"
          rsync -az --delete -e "$RSYNC_SSH" --exclude .venv --exclude __pycache__ ./whisper-service/ "$TARGET/whisper-service/"
          # Parakeet TDT 0.6B v3 (sherpa-onnx): servizio projexa-parakeet, deploy/oracle/setup-parakeet.sh
          rsync -az --delete -e "$RSYNC_SSH" --exclude __pycache__ ./parakeet-service/ "$TARGET/parakeet-service/"
          # Diarizzazione (impronte vocali, sherpa-onnx): servizio projexa-diarizzazione, deploy/oracle/setup-diarizzazione.sh
          rsync -az --delete -e "$RSYNC_SSH" --exclude .venv --exclude modelli --exclude __pycache__ ./diarizzazione-service/ "$TARGET/diarizzazione-service/"
          # Anonymization Layer (Presidio + spaCy): servizio projexa-pii, deploy/oracle/setup-pii.sh
          rsync -az --delete -e "$RSYNC_SSH" --exclude __pycache__ ./pii-service/ "$TARGET/pii-service/"
          # Manuale Utente: lo legge l'assistente AI della dashboard (backend/routes/chatbot.js)
          rsync -az --delete -e "$RSYNC_SSH" ./Documentazione/ "$TARGET/Documentazione/"
          # Script della VM usati dai job (setup-modelli-imatrix.sh: job quantizza_modelli) e Modelfile.
          # Senza --delete: in /opt/projexa/deploy/oracle non si cancella niente. --mkpath: crea anche
          # /opt/projexa/deploy la prima volta (senza, rsync si ferma con «mkdir failed»).
          rsync -az --mkpath -e "$RSYNC_SSH" ./deploy/oracle/ "$TARGET/deploy/oracle/"

      - name: Installa dipendenze e riavvia
        run: |
          ssh -i ~/.ssh/id_oracle "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" '
            set -e
            cd /opt/projexa/backend
            npm ci --omit=dev
            pm2 reload projexa --update-env || pm2 start server.js --name projexa
            pm2 save
            /opt/projexa/whisper-venv/bin/pip install -q -r /opt/projexa/whisper-service/requirements.txt
            for u in $(systemctl list-units --plain --no-legend 'projexa-whisper@*' | awk '{print $1}'); do sudo systemctl restart "$u"; done
            if systemctl is-enabled projexa-parakeet >/dev/null 2>&1; then sudo systemctl restart projexa-parakeet; fi
            if systemctl is-enabled projexa-diarizzazione >/dev/null 2>&1; then sudo systemctl restart projexa-diarizzazione; fi
            if systemctl is-enabled projexa-pii >/dev/null 2>&1; then
              /opt/projexa/pii-venv/bin/pip install -q -r /opt/projexa/pii-service/requirements.txt
              sudo systemctl restart projexa-pii
            fi
            sleep 3
            curl -fsS http://localhost:3001/api/health
          '
