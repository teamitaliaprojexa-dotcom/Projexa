<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projexa - Database Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .database-layout {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .database-sidebar {
      width: 200px;
      background-color: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--border-radius);
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
    }

    .database-sidebar h4 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: var(--gray-600);
      text-transform: uppercase;
    }

    .table-item {
      padding: 10px;
      margin-bottom: 5px;
      background-color: white;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .table-item:hover {
      border-color: var(--primary);
      background-color: var(--gray-50);
    }

    .table-item.active {
      background-color: var(--primary);
      color: white;
    }

    .add-table-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body class="dashboard-page">
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Projexa</h2>
        <button id="logoutBtn" class="btn-small">Logout</button>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" style="background-color: #3B82F6; color: white; display: block; padding: 10px; border-radius: 4px; font-weight: 600; text-align: center;">Dashboard</a>
      </nav>

      <div class="sidebar-section" style="margin-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h4 style="margin: 0; font-size: 0.85rem; color: var(--gray-600); text-transform: uppercase;">Tables</h4>
          <button onclick="loadTableStructuresTable()" style="background: #3B82F6; color: white; border: none; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; font-weight: bold; padding: 0;">+</button>
        </div>
        <div id="tablesList"></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <h1>Database Viewer</h1>
        <div class="header-info">
          <label style="font-size: 0.9rem; margin-right: 1rem;">Ambiente:
            <select id="dbSelect" style="padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; margin-left: 4px;">
              <option value="main">Projexa</option>
              <option value="auth">Projexa-Auth</option>
              <option value="lic">Projexa-Lic</option>
              <option value="notif">Projexa-Notif</option>
            </select>
          </label>
          <button onclick="openCryptoMigration()" style="background: #F59E0B; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; margin-right: 1rem;">
            <i class="fas fa-lock"></i> Migrazione Crypto
          </button>
          <button onclick="window.location.href='sql-editor.html'" style="background: #8B5CF6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; margin-right: 1rem;">
            <i class="fas fa-code"></i> SQL Editor
          </button>
          <span id="userInfo">User</span>
          <span id="tenantInfo">Tenant</span>
        </div>
      </header>

      <div class="content-area">
        <section class="section">
          <div style="margin-bottom: 20px;">
            <h3 id="selectedTableName">Select a table</h3>
            <p id="selectedTableDesc" style="color: var(--gray-600);"></p>
          </div>
          <div id="tableData" class="table-container">
            <p class="loading">Select a table from the list</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Modal for Edit/New Record -->
  <div id="recordModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 8px; padding: 2rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;">
      <h2 id="modalTitle">Edit Record</h2>
      <form id="recordForm" onsubmit="saveRecord(event)">
        <div id="formFields"></div>
        <div style="display: flex; gap: 10px; margin-top: 2rem; justify-content: flex-end;">
          <button type="button" onclick="closeModal()" style="padding: 10px 20px; background: #e5e7eb; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Annulla</button>
          <button type="submit" style="padding: 10px 20px; background: #10B981; color: white; border: none; border-radius: 4px; cursor: pointer;">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Migrazione Crypto: cifra/decifra i dati di UNA tabella alla volta.
       Il database si sceglie qui dentro (parametro "db" nelle chiamate), quindi è
       indipendente dall'ambiente selezionato in alto nella pagina. -->
  <div id="cryptoModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1100; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 8px; padding: 2rem; max-width: 640px; width: 92%; max-height: 88vh; overflow-y: auto;">
      <h2 style="margin-top: 0;"><i class="fas fa-lock" style="color: #F59E0B;"></i> Migrazione Crypto</h2>
      <p style="color: var(--gray-600); font-size: 0.9rem; margin-top: 0;">
        Cifra i dati sul database (a video restano leggibili). Vengono trattate solo le
        righe con <strong>crypto = 1</strong>, secondo la regola configurata nel backend.
      </p>

      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Database</label>
        <select id="cryptoDb" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="main">Projexa</option>
          <option value="auth">Projexa-Auth</option>
          <option value="lic">Projexa-Lic</option>
          <option value="notif">Projexa-Notif</option>
        </select>
      </div>

      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Tabella</label>
        <select id="cryptoTable" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <option value="">-- Caricamento… --</option>
        </select>
      </div>

      <div id="cryptoInfo" style="margin-bottom: 1rem;"></div>
      <div id="cryptoResult" style="margin-bottom: 1rem;"></div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
        <button type="button" onclick="closeCryptoMigration()" style="padding: 10px 20px; background: #e5e7eb; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Chiudi</button>
        <button type="button" id="cryptoDecryptBtn" onclick="runCryptoMigration('decrypt')" style="display: none; padding: 10px 20px; background: #6B7280; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">Decripta</button>
        <button type="button" id="cryptoEncryptBtn" onclick="runCryptoMigration('encrypt')" style="display: none; padding: 10px 20px; background: #DC2626; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">Crypta</button>
      </div>
    </div>
  </div>

  <!-- Selezione ambiente Neon (Projexa vs Projexa-Auth): inietta l'header X-Target-DB su tutte le chiamate /api/ -->
  <script>
    window.__TARGET_DB = sessionStorage.getItem('targetDb') || 'main';
    (function () {
      const orig = window.fetch.bind(window);
      window.fetch = (input, init) => {
        init = init || {};
        try {
          if (window.__TARGET_DB && window.__TARGET_DB !== 'main') {
            const url = (typeof input === 'string') ? input : (input && input.url) || '';
            if (url.indexOf('/api/') !== -1) {
              const h = new Headers(init.headers || {});
              h.set('X-Target-DB', window.__TARGET_DB);
              init = { ...init, headers: h };
            }
          }
        } catch (e) { /* ignore */ }
        return orig(input, init);
      };
    })();
    document.addEventListener('DOMContentLoaded', () => {
      const sel = document.getElementById('dbSelect');
      if (sel) {
        sel.value = window.__TARGET_DB;
        sel.addEventListener('change', () => {
          sessionStorage.setItem('targetDb', sel.value);
          location.reload(); // ricarica con il nuovo ambiente selezionato
        });
      }
    });
  </script>
  <script src="js/auth.js"></script>
  <script src="js/database-viewer.js"></script>
  <script src="js/crypto-migration.js"></script>
</body>
</html>
