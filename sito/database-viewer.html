<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projexa - Database Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .database-layout {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .database-sidebar {
      width: 200px;
      background-color: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--border-radius);
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
    }

    .database-sidebar h4 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: var(--gray-600);
      text-transform: uppercase;
    }

    .table-item {
      padding: 10px;
      margin-bottom: 5px;
      background-color: white;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .table-item:hover {
      border-color: var(--primary);
      background-color: var(--gray-50);
    }

    .table-item.active {
      background-color: var(--primary);
      color: white;
    }

    .add-table-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body class="dashboard-page">
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Projexa</h2>
        <button id="logoutBtn" class="btn-small">Logout</button>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" style="background-color: #3B82F6; color: white; display: block; padding: 10px; border-radius: 4px; font-weight: 600; text-align: center;">Dashboard</a>
      </nav>

      <div class="sidebar-section" style="margin-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h4 style="margin: 0; font-size: 0.85rem; color: var(--gray-600); text-transform: uppercase;">Tables</h4>
          <button onclick="loadTableStructuresTable()" style="background: #3B82F6; color: white; border: none; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; font-weight: bold; padding: 0;">+</button>
        </div>
        <div id="tablesList"></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <h1>Database Viewer</h1>
        <div class="header-info">
          <button onclick="window.location.href='sql-editor.html'" style="background: #8B5CF6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; margin-right: 1rem;">
            <i class="fas fa-code"></i> SQL Editor
          </button>
          <span id="userInfo">User</span>
          <span id="tenantInfo">Tenant</span>
        </div>
      </header>

      <div class="content-area">
        <section class="section">
          <div style="margin-bottom: 20px;">
            <h3 id="selectedTableName">Select a table</h3>
            <p id="selectedTableDesc" style="color: var(--gray-600);"></p>
          </div>
          <div id="tableData" class="table-container">
            <p class="loading">Select a table from the list</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Modal for Edit/New Record -->
  <div id="recordModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 8px; padding: 2rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;">
      <h2 id="modalTitle">Edit Record</h2>
      <form id="recordForm" onsubmit="saveRecord(event)">
        <div id="formFields"></div>
        <div style="display: flex; gap: 10px; margin-top: 2rem; justify-content: flex-end;">
          <button type="button" onclick="closeModal()" style="padding: 10px 20px; background: #e5e7eb; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Annulla</button>
          <button type="submit" style="padding: 10px 20px; background: #10B981; color: white; border: none; border-radius: 4px; cursor: pointer;">Salva</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/database-viewer.js"></script>
</body>
</html>
