<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projexa - Database Viewer</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .database-layout {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .database-sidebar {
      width: 200px;
      background-color: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--border-radius);
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
    }

    .database-sidebar h4 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: var(--gray-600);
      text-transform: uppercase;
    }

    .table-item {
      padding: 10px;
      margin-bottom: 5px;
      background-color: white;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .table-item:hover {
      border-color: var(--primary);
      background-color: var(--gray-50);
    }

    .table-item.active {
      background-color: var(--primary);
      color: white;
    }

    .add-table-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body class="dashboard-page">
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Projexa</h2>
        <button id="logoutBtn" class="btn-small">Logout</button>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="projects.html" class="nav-item">Projects</a>
        <a href="tasks.html" class="nav-item">Tasks</a>
        <a href="risks.html" class="nav-item">Risks</a>
        <a href="database-viewer.html" class="nav-item active">Database Viewer</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <h1>Database Viewer</h1>
        <div class="header-info">
          <span id="userInfo">User</span>
          <span id="tenantInfo">Tenant</span>
        </div>
      </header>

      <div class="content-area">
        <section class="section">
          <div class="database-layout">
            <div class="database-sidebar">
              <h4>Tables</h4>
              <div id="tablesList"></div>
              <button class="add-table-btn" id="addTableBtn">+ Add Table</button>
            </div>

            <div style="flex: 1;">
              <div style="margin-bottom: 20px;">
                <h3 id="selectedTableName">Select a table</h3>
                <p id="selectedTableDesc" style="color: var(--gray-600);"></p>
              </div>
              <div id="tableData" class="table-container">
                <p class="loading">Select a table from the list</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/database-viewer.js"></script>
</body>
</html>
