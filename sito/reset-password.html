<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reimposta password — Projexa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .card { background: #fff; width: 100%; max-width: 440px; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); padding: 2rem; }
        .logo { font-size: 1.6rem; font-weight: 700; color: #059669; text-align: center; margin-bottom: 0.25rem; }
        .intro { background: #ECFDF5; border: 1px solid #A7F3D0; color: #065F46; border-radius: 10px; padding: 0.75rem 1rem; text-align: center; font-size: 0.9rem; margin: 1rem 0 1.25rem; }
        .intro strong { display: block; font-size: 1rem; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: #374151; margin: 0.75rem 0 0.25rem; }
        input[type=text], input[type=email], input[type=password] {
            width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 0.95rem; font-family: inherit;
        }
        input:focus { outline: none; border-color: #10B981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
        input[readonly] { background: #F3F4F6; color: #6B7280; }
        .hint { font-size: 0.75rem; color: #6B7280; margin-top: 0.35rem; }
        .show { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: #6B7280; margin-top: 0.6rem; }
        #saveBtn { width: 100%; margin-top: 1.25rem; padding: 0.8rem; background: #10B981; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        #saveBtn:hover { background: #059669; }
        #saveBtn:disabled { background: #9CA3AF; cursor: default; }
        .msg { margin-top: 0.9rem; font-size: 0.85rem; padding: 0.6rem 0.8rem; border-radius: 8px; display: none; }
        .msg.err { background: #FEF2F2; color: #991B1B; border: 1px solid #FCA5A5; }
        .msg.ok { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
        .backlink { display: block; text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #059669; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Projexa</div>
        <div class="intro" id="intro">
            <strong>Reimposta la password</strong>
            Verifica del link in corso…
        </div>

        <form id="resetForm" autocomplete="off" style="display:none;">
            <label for="email">Account</label>
            <input type="email" id="email" readonly tabindex="-1">

            <label for="password">Nuova password *</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="Almeno 8 caratteri">

            <label for="confirm">Conferma nuova password *</label>
            <input type="password" id="confirm" autocomplete="new-password" placeholder="Ripeti la password">

            <label class="show"><input type="checkbox" id="showPw"> Mostra le password</label>
            <div class="hint">La nuova password deve avere almeno 8 caratteri.</div>

            <button type="submit" id="saveBtn">Salva nuova password</button>
        </form>

        <div class="msg err" id="errMsg"></div>
        <div class="msg ok" id="okMsg"></div>
        <a class="backlink" href="./login.html">← Torna al login</a>
    </div>

    <script>
        const IS_LOCAL_HOST = ['localhost', '127.0.0.1'].includes(location.hostname);
        const BACKEND_URL = IS_LOCAL_HOST ? location.origin : (location.hostname.endsWith('github.io') ? 'https://projexa-4mix.onrender.com' : location.origin);
        const API_URL = BACKEND_URL + '/api';

        const el = (id) => document.getElementById(id);
        const token = (new URLSearchParams(location.search).get('token') || '').trim();

        function showErr(t) { const e = el('errMsg'); e.textContent = t; e.style.display = 'block'; el('okMsg').style.display = 'none'; }
        function showOk(t) { const o = el('okMsg'); o.textContent = t; o.style.display = 'block'; el('errMsg').style.display = 'none'; }

        // Verifica il link prima di mostrare il form: token assente, scaduto o già usato -> solo errore.
        async function init() {
            if (!token) {
                el('intro').innerHTML = '<strong>Link non valido</strong>Manca il codice di reimpostazione.';
                showErr('Apri il link ricevuto per email oppure richiedine uno nuovo.');
                return;
            }
            try {
                const res = await fetch(`${API_URL}/auth/reset-info?token=${encodeURIComponent(token)}`);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    el('intro').innerHTML = '<strong>Link non più valido</strong>Richiedi una nuova email di reimpostazione.';
                    showErr(data.error || 'Link non valido o scaduto.');
                    return;
                }
                el('intro').innerHTML = '<strong>Reimposta la password</strong>Scegli la nuova password del tuo account.';
                el('email').value = data.email || '';
                el('resetForm').style.display = 'block';
                el('password').focus();
            } catch (e) {
                showErr('Errore di connessione al server.');
            }
        }

        el('showPw').addEventListener('change', () => {
            const t = el('showPw').checked ? 'text' : 'password';
            el('password').type = t;
            el('confirm').type = t;
        });

        el('resetForm').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const pw = el('password').value;
            const cf = el('confirm').value;
            if (pw.length < 8) { showErr('La nuova password deve avere almeno 8 caratteri.'); el('password').focus(); return; }
            if (pw !== cf) { showErr('Le password non coincidono.'); el('confirm').focus(); return; }

            const btn = el('saveBtn'); btn.disabled = true;
            try {
                const res = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: pw, confirmPassword: cf })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    el('resetForm').style.display = 'none';
                    showOk('Password aggiornata! Ti reindirizziamo al login…');
                    setTimeout(() => { location.href = './login.html?password_reset=1'; }, 1800);
                } else {
                    showErr(data.error || 'Reimpostazione non riuscita.');
                    btn.disabled = false;
                }
            } catch (e) {
                showErr('Errore di connessione al server.');
                btn.disabled = false;
            }
        });

        init();
    </script>
</body>
</html>
