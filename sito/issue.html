<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue - Projexa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3B82F6;
            --primary-dark: #1E40AF;
            --secondary: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --dark: #1F2937;
            --light: #F9FAFB;
            --border: #E5E7EB;
            --text-muted: #6B7280;
            --radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: var(--dark);
            line-height: 1.6;
            background: var(--light);
            padding: 1.5rem;
        }

        .container {
            max-width: 100%;
            width: 100%;
            margin: 0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            background: white;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .client-selector {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 250px;
        }

        .client-selector label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .client-selector select {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }

        .client-info {
            margin-left: auto;
            text-align: right;
            min-width: 200px;
        }

        .client-info h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .client-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .dashboard-section {
            background: white;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .dashboard-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dashboard-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            min-height: 100px;
        }

        .dashboard-left {
            border-right: 1px solid var(--border);
            padding-right: 1rem;
        }

        .dashboard-right {
            padding-left: 1rem;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .kpi-card {
            background: var(--light);
            padding: 0.5rem;
            border-radius: var(--radius);
            text-align: center;
        }

        .kpi-value {
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .kpi-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .toolbar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.325rem 1.25rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #DC2626;
        }

        .btn-danger:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #D97706;
        }

        .btn-warning:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #059669;
        }

        .btn-secondary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        .grid-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: var(--light);
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 0.5rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dark);
        }

        td {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(59, 130, 246, 0.02);
        }

        tbody tr.selected {
            background: rgba(59, 130, 246, 0.1);
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            padding: 0.325rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            width: 100%;
            max-width: 100%;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 30px;
        }

        .checkbox-cell {
            text-align: center;
        }

        .checkbox-cell input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .editable td {
            padding: 0.25rem;
        }

        .editable input,
        .editable select,
        .editable textarea {
            width: 100%;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 1rem;
            color: var(--text-muted);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 1.5rem 0.5rem;
            color: var(--text-muted);
        }

        .no-data i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header con selezione cliente -->
        <div class="header">
            <a href="dashboard.html" class="btn btn-secondary" title="Torna alla dashboard" style="text-decoration: none; flex: 0 0 auto;">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
            <div class="client-selector">
                <label for="clientSelect">Azienda</label>
                <select id="clientSelect">
                    <option value="">-- Seleziona azienda --</option>
                </select>
            </div>
            <div class="client-info" id="clientInfo" style="display: none;">
                <h3 id="clientName"></h3>
                <p id="clientEmail"></p>
            </div>
        </div>

        <!-- Sezione Dashboard: Logo cliente e KPI -->
        <div class="dashboard-section" id="dashboardSection" style="display: none;">
            <div class="dashboard-title">Dashboard e KPI</div>
            <div class="dashboard-content">
                <div class="dashboard-left">
                    <div style="width: 100px; height: 75px; background: var(--light); border: 2px dashed var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
                        <div style="text-align: center;">
                            <i class="fas fa-image" style="font-size: 1rem; margin-bottom: 0.25rem;"></i>
                            <div style="font-size: 0.6rem;">Logo cliente</div>
                            <div style="font-size: 0.55rem; color: #999;">(da aggiungere)</div>
                        </div>
                    </div>
                </div>
                <div class="dashboard-right">
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="kpi-value" id="kpiAperti">-</div>
                            <div class="kpi-label">Totale issue aperti</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-value" id="kpiChiusi">-</div>
                            <div class="kpi-label">Issue chiusi</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-value" id="kpiAlta">-</div>
                            <div class="kpi-label">Priorità alta</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-value" id="kpiMedia">-</div>
                            <div class="kpi-label">Priorità media</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-value" id="kpiBassa">-</div>
                            <div class="kpi-label">Priorità bassa</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-value" id="kpiSospesi">-</div>
                            <div class="kpi-label">Attività in sospeso</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Messaggi di errore e successo -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Toolbar -->
        <div class="toolbar" id="toolbar" style="display: none;">
            <button class="btn btn-primary" id="addBtn" title="Aggiungi una nuova issue">
                <i class="fas fa-plus"></i> Aggiungi
            </button>
            <button class="btn btn-danger" id="deleteBtn" title="Elimina l'issue selezionata" disabled>
                <i class="fas fa-trash"></i> Elimina
            </button>
            <button class="btn btn-warning" id="closeBtn" title="Chiudi l'issue selezionata" disabled>
                <i class="fas fa-check-circle"></i> Chiudi
            </button>
            <button class="btn btn-secondary" id="editBtn" title="Modifica le issue">
                <i class="fas fa-pen"></i> Modifica
            </button>
            <button class="btn btn-secondary" id="saveBtn" title="Salva le modifiche" style="display: none;">
                <i class="fas fa-save"></i> Salva
            </button>
            <button class="btn btn-secondary" id="cancelBtn" title="Annulla le modifiche" style="display: none;">
                <i class="fas fa-times"></i> Annulla
            </button>
        </div>

        <!-- Griglia dati -->
        <div class="dashboard-section" id="gridSection" style="display: none;">
            <div class="grid-container">
                <div class="loading" id="loadingSpinner">
                    <div class="spinner"></div>
                    <p>Caricamento dati...</p>
                </div>
                <table id="issueTable" style="display: none;">
                    <thead>
                        <tr id="headerRow">
                            <th style="width: 30px;">
                                <input type="checkbox" id="selectAllCheckbox">
                            </th>
                        </tr>
                    </thead>
                    <tbody id="issueTableBody">
                    </tbody>
                </table>
                <div class="no-data" id="noData" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <p>Nessuna issue trovata</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/issue.js"></script>
</body>
</html>
