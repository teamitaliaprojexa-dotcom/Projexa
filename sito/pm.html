<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projexa - Cruscotto PM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/pm.css">
    <!--
      CRUSCOTTO PM del progetto (pulsante «Cruscotto PM» nella scheda progetto della dashboard).
      Schede: Panoramica (semaforo di salute, previsione a finire, tempi e Gantt), RAID (rischi,
      decisioni, dipendenze + azioni e issue), Change Request, Economia (valore guadagnato in euro,
      CPI/SPI, margine, costi esterni, valuta), Stakeholder e RACI, Chiusura
      (accettazione, soddisfazione, lessons learned, verbale), Chiedi al progetto (AI).
      In alto: Briefing pre-riunione e Status Report. API: /api/pm (backend/routes/pm.js).
    -->
</head>
<body>
    <div class="pm-top">
        <button class="pm-btn" id="indietro" title="Torna alla scheda del progetto"><i class="fas fa-arrow-left"></i> Progetto</button>
        <h1><i class="fas fa-gauge-high"></i> <span id="titolo">Cruscotto PM</span></h1>
        <span id="semTop"></span>
        <span class="sub" id="sottotitolo"></span>
        <span class="spazio"></span>
        <button class="pm-btn" id="btnBriefing" title="Briefing da leggere prima della prossima riunione (AI)"><i class="fas fa-clipboard-list"></i> Briefing riunione</button>
        <button class="pm-btn primario" id="btnStatus" title="Status Report (SAL) del progetto, scritto con l'AI"><i class="fas fa-file-lines"></i> Status Report</button>
        <a class="pm-btn" href="portfolio.html" title="Tutti i tuoi progetti"><i class="fas fa-layer-group"></i> Portfolio</a>
    </div>
    <nav class="pm-tabs" id="tabs">
        <button class="pm-tab on" data-tab="panoramica"><i class="fas fa-heart-pulse"></i> Panoramica</button>
        <button class="pm-tab" data-tab="raid"><i class="fas fa-shield-halved"></i> RAID <span class="cnt" id="cntRaid"></span></button>
        <button class="pm-tab" data-tab="cr"><i class="fas fa-code-pull-request"></i> Change Request <span class="cnt" id="cntCr"></span></button>
        <button class="pm-tab" data-tab="economia"><i class="fas fa-euro-sign"></i> Economia</button>
        <button class="pm-tab" data-tab="stakeholder"><i class="fas fa-users"></i> Stakeholder e RACI</button>
        <button class="pm-tab" data-tab="chiusura"><i class="fas fa-flag-checkered"></i> Chiusura</button>
        <button class="pm-tab" data-tab="chiedi"><i class="fas fa-comments"></i> Chiedi al progetto</button>
    </nav>
    <main class="pm-main">
        <div id="avvisi"></div>
        <section class="pm-pannello on" id="p-panoramica"><div class="pm-attesa"><i class="fas fa-spinner fa-spin"></i> Calcolo la salute del progetto…</div></section>
        <section class="pm-pannello" id="p-raid"></section>
        <section class="pm-pannello" id="p-cr"></section>
        <section class="pm-pannello" id="p-economia"></section>
        <section class="pm-pannello" id="p-stakeholder"></section>
        <section class="pm-pannello" id="p-chiusura"></section>
        <section class="pm-pannello" id="p-chiedi"></section>
    </main>

    <script src="js/ai-scelta.js"></script>
    <script src="js/pm-comune.js"></script>
    <script>
    (function () {
        const { esc, api, fmt, euro, dataIt, badge, toast, testoAiHtml, modale, valori } = PM;
        const qs = new URLSearchParams(location.search);
        const projectId = qs.get('projectId') || '';
        let dati = null;          // risposta di /progetto
        let unita = 'giorni';
        const caricati = {};      // schede già caricate

        // ---------------- navigazione ----------------
        document.getElementById('indietro').addEventListener('click', () => {
            if (!dati) { location.href = 'dashboard.html'; return; }
            const p = new URLSearchParams({ openProject: projectId, clientId: dati.progetto.clientId || '', projectName: dati.progetto.nome || '', clientName: dati.progetto.cliente || '' });
            location.href = `dashboard.html?${p.toString()}`;
        });
        const tabs = document.getElementById('tabs');
        function apriTab(nome) {
            tabs.querySelectorAll('.pm-tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === nome));
            document.querySelectorAll('.pm-pannello').forEach((p) => p.classList.toggle('on', p.id === `p-${nome}`));
            if (!caricati[nome]) { caricati[nome] = true; CARICA[nome] && CARICA[nome](); }
            history.replaceState(null, '', `${location.pathname}?${new URLSearchParams({ ...Object.fromEntries(qs), tab: nome }).toString()}`);
        }
        tabs.addEventListener('click', (e) => { const b = e.target.closest('.pm-tab'); if (b) apriTab(b.dataset.tab); });

        const pannello = (id) => document.getElementById(`p-${id}`);
        const attesa = (t) => `<div class="pm-attesa"><i class="fas fa-spinner fa-spin"></i> ${esc(t)}</div>`;
        const errore = (e) => `<div class="pm-errore"><i class="fas fa-triangle-exclamation"></i> ${esc(e.message || e)}</div>`;
        const sqlMancante = () => '<div class="pm-avviso"><i class="fas fa-database"></i> Funzione non ancora attiva: va eseguito lo script <b>Supporto/CreaDB/pm_senior.sql</b> sul database. Fino ad allora vedi i dati ma non puoi salvare.</div>';

        // ================= PANORAMICA =================
        async function caricaPanoramica() {
            const p = pannello('panoramica');
            try {
                dati = await api(`/progetto?projectId=${encodeURIComponent(projectId)}`);
                unita = dati.eac.unita;
                document.title = `Cruscotto PM - ${dati.progetto.nome}`;
                document.getElementById('titolo').textContent = dati.progetto.nome;
                document.getElementById('sottotitolo').textContent = `${dati.progetto.cliente || ''}${dati.progetto.aperto ? '' : ' · progetto chiuso'}`;
                document.getElementById('semTop').innerHTML = badge(dati.semaforo);
                const c = dati.conteggi;
                document.getElementById('cntRaid').textContent = c.rischiAperti || '';
                document.getElementById('cntCr').textContent = c.crAperte || '';
                if (!dati.tabelle) document.getElementById('avvisi').innerHTML = sqlMancante();
                renderPanoramica(p);
            } catch (e) { p.innerHTML = errore(e); }
        }

        function renderPanoramica(p) {
            const d = dati, e = d.eac, g = d.gantt, s = d.scheda;
            // Stessa soglia del semaforo (pmCore.js): sotto il 15% di completamento la stima a
            // finire si mostra in grigio, come indicazione e non come allarme.
            const affidabile = e.completamento != null && e.completamento >= 15, GRIGIO = '#6B7280';
            // Valore con l'unità del progetto (ore con Gestione a HH, altrimenti giorni).
            const conU = (v) => (v == null ? '–' : `${fmt(v)} <span style="font-size:0.75em;font-weight:600;color:#6B7280">${unita === 'ore' ? 'ore' : 'gg'}</span>`);
            const testoSem = { verde: 'Il progetto è in linea', giallo: 'Ci sono punti di attenzione', rosso: 'Il progetto richiede un intervento', nd: 'Dati insufficienti per un giudizio' };
            const ind = d.indicatori.map((i) => `<div class="pm-ind-riga"><div><b>${esc(i.titolo)}</b><br>${badge(i.stato)}</div><div>${esc(i.nota)}</div></div>`).join('');
            // Barra budget: speso, oltre il budget, stima a finire (rosso), budget (nero).
            let barra = '<div class="pm-vuoto">Compila l\'offerta effort nei Costi Progetto per vedere il budget.</div>';
            if (e.bac > 0) {
                const scala = Math.max(e.bac, e.ac, e.eac || 0) * 1.05;
                const pc = (v) => `${Math.min(100, (v / scala) * 100)}%`;
                barra = `<div class="pm-barra" title="Speso ${fmt(e.ac)} su ${fmt(e.bac)} ${unita}">
                        <div class="speso" style="width:${pc(Math.min(e.ac, e.bac))}"></div>
                        ${e.ac > e.bac ? `<div class="oltre" style="left:${pc(e.bac)}; width:calc(${pc(e.ac)} - ${pc(e.bac)})"></div>` : ''}
                        <div class="bac" style="left:${pc(e.bac)}"></div>
                        ${e.eac != null ? `<div class="eac" style="left:${pc(e.eac)}" title="Stima a finire ${fmt(e.eac)}"></div>` : ''}
                    </div>
                    <div class="pm-legenda"><span><i style="background:#818CF8"></i>Speso</span><span><i style="background:#111827"></i>Budget</span>${e.eac != null ? '<span><i style="background:#DC2626"></i>Stima a finire</span>' : ''}</div>`;
            }
            const compl = e.completamento != null ? `${fmt(e.completamento, 0)}%${e.fonteCompletamento === 'gantt' ? ' (dal Gantt)' : ''}` : '–';
            const ritmo = e.ritmoGiorno ? `<p class="pm-nota"><i class="fas fa-gauge"></i> Ritmo delle ultime settimane: ${fmt(e.ritmoGiorno, 2)} ${unita} al giorno${e.esaurimentoBudget ? ` · budget esaurito intorno al <b>${dataIt(e.esaurimentoBudget)}</b>` : ''}${e.finePrevista ? ` · lavoro finito intorno al <b>${dataIt(e.finePrevista)}</b>` : ''}</p>`
                : '<p class="pm-nota"><i class="fas fa-circle-info"></i> Il ritmo di consumo e la data di esaurimento del budget compaiono dopo una settimana di fotografie giornaliere (job sul server).</p>';
            const ms = g.milestone.length ? `<table class="pm-t"><thead><tr><th>Milestone</th><th>Data</th><th>Baseline</th><th>Stato</th></tr></thead><tbody>${g.milestone.map((m) => `<tr><td>◆ ${esc(m.nome)}</td><td>${dataIt(m.data)}</td><td>${m.baseline ? `${dataIt(m.baseline)}${m.scostamento ? ` <span class="pill ${m.scostamento > 0 ? 'rifiutata' : 'approvata'}">${m.scostamento > 0 ? '+' : ''}${m.scostamento} gg</span>` : ''}` : '–'}</td><td>${m.raggiunta ? '<span class="pill approvata">raggiunta</span>' : (m.scaduta ? '<span class="pill rifiutata">superata</span>' : '<span class="pill">da fare</span>')}</td></tr>`).join('')}</tbody></table>`
                : '<div class="pm-vuoto">Nessuna milestone: nel Gantt apri un\'attività e attiva «Milestone».</div>';
            const ritardi = g.inRitardo.length ? `<ul>${g.inRitardo.slice(0, 8).map((r) => `<li><b>${esc(r.nome)}</b>: doveva finire il ${dataIt(r.fine)}, ${r.avanzamento}% (${r.giorni} gg di ritardo)${r.owner ? ` · ${esc(r.owner)}` : ''}</li>`).join('')}</ul>` : '<div class="pm-vuoto">Nessuna attività in ritardo.</div>';
            const voci = d.economia.voci.length ? `<table class="pm-t"><thead><tr><th>Voce</th><th class="n">Offerta (${unita === 'ore' ? 'ore' : 'gg'})</th><th class="n">Speso (${unita === 'ore' ? 'ore' : 'gg'})</th><th class="n">%</th></tr></thead><tbody>${d.economia.voci.map((v) => `<tr><td>${esc(v.voce)}</td><td class="n">${fmt(v.offerta)}</td><td class="n">${fmt(v.speso)}</td><td class="n" style="color:${v.offerta && v.speso > v.offerta ? '#DC2626' : 'inherit'}">${v.offerta ? `${fmt((v.speso / v.offerta) * 100, 0)}%` : '–'}</td></tr>`).join('')}</tbody></table>` : '<div class="pm-vuoto">Nessuna voce nei Costi Progetto.</div>';
            const gLink = d.ganttCampo ? `gantt.html?${new URLSearchParams({ fieldId: d.ganttCampo.fieldId, clientId: d.progetto.clientId || '', label: d.ganttCampo.label, projectId, projectName: d.progetto.nome, clientName: d.progetto.cliente || '' })}` : '';
            p.innerHTML = `
            <div class="pm-griglia">
                <div class="pm-card">
                    <h2><i class="fas fa-heart-pulse"></i> Salute del progetto</h2>
                    <div class="pm-semaforo-grande"><div class="pm-luce ${d.semaforo}"><i class="fas ${PM.SEMAFORO[d.semaforo].ico}"></i></div>
                        <div><b style="font-size:1.05rem">${esc(testoSem[d.semaforo])}</b><div class="pm-nota">Il semaforo prende il colore peggiore dei 5 indicatori. Aggiornato a ogni apertura.</div></div></div>
                    <div class="pm-ind" style="margin-top:0.8rem">${ind}</div>
                </div>
                <div class="pm-card">
                    <h2><i class="fas fa-chart-line"></i> Previsione a finire <span class="pm-nota">(in ${esc(unita)}${unita === 'ore' ? ': Gestione a HH' : ''})</span></h2>
                    <div class="pm-kpi">
                        <div><small>Budget</small><b>${conU(e.bac)}</b>${e.crDelta ? `<div class="pm-nota">di cui CR ${e.crDelta > 0 ? '+' : ''}${conU(e.crDelta)}</div>` : ''}</div>
                        <div><small>Speso</small><b>${conU(e.ac)}</b></div>
                        <div><small>Completamento</small><b>${compl}</b></div>
                        <div><small>Stima a finire</small><b style="color:${!affidabile ? GRIGIO : (e.percPrevista > 100 ? '#DC2626' : 'inherit')}">${conU(e.eac)}</b>${e.percPrevista != null ? `<div class="pm-nota">${fmt(e.percPrevista, 0)}% del budget${affidabile ? '' : ' · poco affidabile'}</div>` : ''}</div>
                        <div><small>Mancano</small><b style="color:${affidabile ? 'inherit' : GRIGIO}">${conU(e.etc)}</b></div>
                        <div><small>Margine a finire</small><b style="color:${!affidabile ? GRIGIO : (e.vac < 0 ? '#DC2626' : '#059669')}">${e.vac != null ? `${e.vac > 0 ? '+' : ''}${conU(e.vac)}` : '–'}</b>${e.valoreEuro != null ? `<div class="pm-nota">≈ ${euro(e.valoreEuro)}</div>` : ''}</div>
                        <div><small>Efficienza (CPI)</small><b style="color:${!affidabile ? GRIGIO : (e.cpi != null && e.cpi < 0.95 ? '#DC2626' : 'inherit')}">${e.cpi != null ? fmt(e.cpi, 2) : '–'}</b><div class="pm-nota">1 = in linea</div></div>
                    </div>
                    ${barra}
                    ${e.eac != null && !affidabile ? `<p class="pm-avviso" style="margin:0.6rem 0"><i class="fas fa-circle-info"></i> Completamento sotto il 15%: la stima a finire è ancora poco affidabile (pochi punti di completamento la cambiano molto) e non colora il semaforo. Aggiorna il completamento reale per renderla significativa.</p>` : ''}
                    ${ritmo}
                    <p class="pm-nota">Stima a finire = speso ÷ completamento. Se il completamento della scheda manca si usa quello calcolato dal Gantt.</p>
                </div>
            </div>
            <div class="pm-griglia" style="margin-top:1rem">
                <div class="pm-card">
                    <h2><i class="fas fa-calendar-days"></i> Tempi e Gantt <span class="azioni">${gLink ? `<a class="pm-btn piccolo" href="${esc(gLink)}"><i class="fas fa-chart-gantt"></i> Apri il Gantt</a>` : ''}</span></h2>
                    <div class="pm-kpi">
                        <div><small>Periodo (scheda)</small><b style="font-size:0.9rem">${dataIt(s.start) || '?'} → ${dataIt(s.end) || '?'}</b></div>
                        <div><small>Gantt</small><b style="font-size:0.9rem">${g.inizio ? `${dataIt(g.inizio)} → ${dataIt(g.fine)}` : 'vuoto'}</b></div>
                        <div><small>Baseline fine</small><b style="font-size:0.9rem">${g.baselineFine ? dataIt(g.baselineFine) : 'non fissata'}</b>${g.scostamentoGiorni ? `<div class="pm-nota" style="color:${g.scostamentoGiorni > 0 ? '#DC2626' : '#059669'}">${g.scostamentoGiorni > 0 ? '+' : ''}${g.scostamentoGiorni} giorni</div>` : ''}</div>
                        <div><small>Completamento Gantt</small><b>${g.completamento != null ? `${fmt(g.completamento, 0)}%` : '–'}</b><div class="pm-nota">scheda: ${s.completamento != null ? `${fmt(s.completamento, 0)}%` : '–'}</div></div>
                        <div><small>Percorso critico</small><b>${g.critico.length}</b><div class="pm-nota">attività senza margine</div></div>
                    </div>
                    <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin:0.8rem 0">
                        <button class="pm-btn piccolo" id="btnBaseline" ${g.attivita ? '' : 'disabled'} title="Copia le date attuali di tutte le attività come piano di riferimento"><i class="fas fa-snowflake"></i> ${g.baselineFine ? 'Aggiorna la baseline' : 'Congela la baseline'}</button>
                        <button class="pm-btn piccolo" id="btnCompl" ${g.completamento != null ? '' : 'disabled'} title="Scrive nel campo Completamento della scheda il valore calcolato dal Gantt"><i class="fas fa-percent"></i> Porta ${g.completamento != null ? `${fmt(g.completamento, 0)}%` : ''} nella scheda</button>
                    </div>
                    <b style="font-size:0.85rem">Attività in ritardo</b>${ritardi}
                </div>
                <div class="pm-card"><h2><i class="fas fa-gem"></i> Milestone</h2>${ms}</div>
                <div class="pm-card"><h2><i class="fas fa-coins"></i> Effort per voce di costo</h2>${voci}</div>
            </div>`;
            p.querySelector('#btnBaseline').addEventListener('click', async (ev) => {
                const testo = g.baselineFine
                    ? 'La baseline attuale verrà sostituita con le date di oggi: lo scostamento ripartirà da zero. Procedere?'
                    : 'Le date attuali di tutte le attività diventano il piano di riferimento (baseline): da qui in poi Projexa misura gli slittamenti. Procedere?';
                if (!confirm(testo)) return;
                ev.currentTarget.disabled = true;
                try { const r = await api('/gantt/baseline', { metodo: 'POST', corpo: { projectId } }); toast(`Baseline fissata su ${r.attivita} attività`); caricaPanoramica(); }
                catch (err) { toast(err.message, 'errore'); ev.currentTarget.disabled = false; }
            });
            p.querySelector('#btnCompl').addEventListener('click', async (ev) => {
                ev.currentTarget.disabled = true;
                try { const r = await api('/gantt/completamento', { metodo: 'POST', corpo: { projectId } }); toast(`Completamento della scheda: ${r.completamento}%`); caricaPanoramica(); }
                catch (err) { toast(err.message, 'errore'); ev.currentTarget.disabled = false; }
            });
        }

        // ================= RAID =================
        let raidDati = null, raidTutte = false;
        const TIPI = {
            rischio: { label: 'Rischio', plurale: 'Rischi', ico: 'fa-triangle-exclamation' },
            decisione: { label: 'Decisione', plurale: 'Decisioni', ico: 'fa-gavel' },
            dipendenza: { label: 'Dipendenza', plurale: 'Dipendenze', ico: 'fa-link' },
            assunzione: { label: 'Assunzione', plurale: 'Assunzioni', ico: 'fa-lightbulb' }
        };
        const STATI = { aperto: 'Aperto', in_corso: 'In corso', chiuso: 'Chiuso' };
        const classePunti = (n) => (n >= 15 ? 'alto' : n >= 8 ? 'medio' : 'basso');
        async function caricaRaid() {
            const p = pannello('raid');
            p.innerHTML = attesa('Carico il registro RAID…');
            try { raidDati = await api(`/raid?projectId=${encodeURIComponent(projectId)}${raidTutte ? '&tutte=1' : ''}`); renderRaid(p); }
            catch (e) { p.innerHTML = errore(e); }
        }
        function heatmap(rischi) {
            const aperti = rischi.filter((r) => r.stato !== 'chiuso' && r.probabilita && r.impatto);
            const colore = (pr, im) => { const n = pr * im; return n >= 15 ? '#FCA5A5' : n >= 8 ? '#FDE68A' : '#BBF7D0'; };
            let h = '';
            for (let pr = 5; pr >= 1; pr--) {
                h += `<div class="ax">${pr}</div>`;
                for (let im = 1; im <= 5; im++) {
                    const n = aperti.filter((r) => r.probabilita === pr && r.impatto === im).length;
                    h += `<div style="background:${colore(pr, im)}; opacity:${n ? 1 : 0.45}" title="Probabilità ${pr} × impatto ${im}: ${n} rischi">${n || ''}</div>`;
                }
            }
            h += '<div class="ax"></div>' + [1, 2, 3, 4, 5].map((i) => `<div class="ax">${i}</div>`).join('');
            return `<div><div class="heat">${h}</div><div class="pm-nota" style="margin-top:0.3rem">↑ probabilità · → impatto (rischi aperti)</div></div>`;
        }
        function renderRaid(p) {
            // Senza «anche chiusi» si nascondono sia le righe con Stato «Chiuso» sia quelle tolte dal registro.
            const r = raidTutte ? raidDati.raid : raidDati.raid.filter((x) => x.stato !== 'chiuso');
            const per = (t) => r.filter((x) => x.tipo === t);
            const riga = (x, cols) => `<tr class="click${x.stato === 'chiuso' || x.riga_chiusa ? ' chiuso' : ''}" data-id="${esc(x.id)}">${cols(x)}</tr>`;
            // Riga tolta dal registro: scadenza = giorno prima della chiusura.
            const chiusaIl = (x) => { const d = new Date(Date.parse(`${x.scadenza_riga}T00:00:00Z`) + 86400000); return isNaN(d) ? '' : dataIt(d.toISOString().slice(0, 10)); };
            const origine = (x) => (x.origine === 'riunione' ? ' <span class="pill riunione" title="Estratto da una riunione"><i class="fas fa-microphone-lines"></i></span>' : '')
                + (x.riga_chiusa ? ` <span class="pill rifiutata" title="Tolta dal registro: aprila per riaprirla">fuori registro dal ${chiusaIl(x)}</span>` : '');
            const rischi = per('rischio').sort((a, b) => (a.stato === 'chiuso') - (b.stato === 'chiuso') || (b.punteggio || 0) - (a.punteggio || 0));
            const tabRischi = rischi.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr><th class="n">Punti</th><th>Rischio</th><th class="n">P</th><th class="n">I</th><th>Owner</th><th>Risposta</th><th>Revisione</th><th>Stato</th></tr></thead><tbody>
                ${rischi.map((x) => riga(x, () => `<td class="n">${x.punteggio ? `<span class="punti ${classePunti(x.punteggio)}">${x.punteggio}</span>` : '–'}</td><td><b>${esc(x.titolo)}</b>${origine(x)}${x.descrizione ? `<div class="pm-nota">${esc(x.descrizione)}</div>` : ''}</td><td class="n">${x.probabilita || '–'}</td><td class="n">${x.impatto || '–'}</td><td>${esc(x.owner || '')}</td><td>${esc(x.mitigazione || '')}</td><td>${dataIt(x.data_revisione)}${x.data_revisione && x.data_revisione < (dati ? dati.oggi : '') && x.stato !== 'chiuso' ? ' <i class="fas fa-bell" style="color:#DC2626" title="Da rivedere"></i>' : ''}</td><td><span class="pill ${x.stato}">${STATI[x.stato] || x.stato}</span></td>`)).join('')}</tbody></table></div>`
                : '<div class="pm-vuoto">Nessun rischio registrato.</div>';
            const tabSemplice = (lista, conData) => (lista.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr>${conData ? '<th>Data</th>' : ''}<th>Titolo</th><th>${conData ? 'Decisa da' : 'Owner'}</th><th>Stato</th></tr></thead><tbody>
                ${lista.map((x) => riga(x, () => `${conData ? `<td>${dataIt(x.data_revisione)}</td>` : ''}<td><b>${esc(x.titolo)}</b>${origine(x)}${x.tipo === 'assunzione' ? ' <span class="pill">assunzione</span>' : ''}${x.descrizione ? `<div class="pm-nota">${esc(x.descrizione)}</div>` : ''}</td><td>${esc(conData ? x.decisa_da || '' : x.owner || '')}</td><td><span class="pill ${x.stato}">${STATI[x.stato] || x.stato}</span></td>`)).join('')}</tbody></table></div>`
                : '<div class="pm-vuoto">Nessun elemento.</div>');
            const azioni = raidDati.task.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr><th>Azione</th><th>Assegnata a</th><th>Scadenza</th></tr></thead><tbody>${raidDati.task.map((t) => `<tr><td><a class="pm-link" href="dashboard.html?openTask=${encodeURIComponent(t.id)}" target="_blank" rel="noopener" title="Apri la To-Do in modifica (nuova scheda)"><b>${esc(t.titolo)}</b> <i class="fas fa-up-right-from-square" style="font-size:0.7em"></i></a>${t.descrizione ? `<div class="pm-nota">${esc(t.descrizione.slice(0, 220))}</div>` : ''}</td><td>${esc(t.assegnato || '–')}</td><td style="color:${t.scaduta ? '#DC2626' : 'inherit'}">${dataIt(t.scadenza) || '–'}${t.scaduta ? ' (scaduta)' : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="pm-vuoto">Nessuna azione aperta sul progetto.</div>';
            const issue = raidDati.issue.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr><th>Issue</th><th>Priorità</th><th>Owner</th><th>Stato</th></tr></thead><tbody>${raidDati.issue.map((i) => `<tr><td>${esc(String(i.descrizione || '').slice(0, 300))}</td><td>${esc(i.priorita || '')}</td><td>${esc(i.owner || '')}</td><td>${esc(i.stato || '')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="pm-vuoto">Nessuna issue aperta sul progetto.</div>';
            const nuovo = (t) => `<button class="pm-btn piccolo" data-nuovo="${t}"><i class="fas fa-plus"></i> ${TIPI[t].label}</button>`;
            p.innerHTML = `${raidDati.tabelle ? '' : sqlMancante()}
                <div class="pm-card">
                    <h2><i class="fas fa-triangle-exclamation"></i> Rischi <span class="azioni">
                        <label class="pm-nota" style="display:flex;align-items:center;gap:0.3rem" title="Mostra anche le righe con Stato «Chiuso» e quelle tolte dal registro con «Togli dal registro» (scadenza passata)."><input type="checkbox" id="raidTutte" ${raidTutte ? 'checked' : ''}> anche chiusi (scaduti)</label>
                        <button class="pm-btn piccolo verde" id="btnEstrai" title="L'AI legge il recap di una riunione e propone rischi, decisioni, dipendenze e Change Request (in bozza)"><i class="fas fa-wand-magic-sparkles"></i> Estrai dalle riunioni</button>${nuovo('rischio')}</span></h2>
                    <div style="display:grid; grid-template-columns: minmax(0,1fr) auto; gap:1.2rem; align-items:start">${tabRischi}${heatmap(rischi)}</div>
                </div>
                <div class="pm-griglia" style="margin-top:1rem">
                    <div class="pm-card"><h2><i class="fas fa-gavel"></i> Decisioni <span class="azioni">${nuovo('decisione')}</span></h2>${tabSemplice(per('decisione'), true)}</div>
                    <div class="pm-card"><h2><i class="fas fa-link"></i> Dipendenze e assunzioni <span class="azioni">${nuovo('dipendenza')}${nuovo('assunzione')}</span></h2>${tabSemplice([...per('dipendenza'), ...per('assunzione')], false)}</div>
                </div>
                <div class="pm-griglia" style="margin-top:1rem">
                    <div class="pm-card"><h2><i class="fas fa-list-check"></i> Azioni aperte <span class="pm-nota">(dalla To-Do List)</span></h2>${azioni}</div>
                    <div class="pm-card"><h2><i class="fas fa-bug"></i> Issue aperte <span class="pm-nota">(dalla sezione Issue)</span></h2>${issue}</div>
                </div>`;
            p.querySelector('#raidTutte').addEventListener('change', (e) => { raidTutte = e.target.checked; caricaRaid(); });
            p.querySelectorAll('[data-nuovo]').forEach((b) => b.addEventListener('click', () => formRaid({ tipo: b.dataset.nuovo })));
            p.querySelectorAll('tr.click[data-id]').forEach((tr) => tr.addEventListener('click', () => formRaid(r.find((x) => x.id === tr.dataset.id))));
            p.querySelector('#btnEstrai').addEventListener('click', () => estraiDaRiunione());
            if (qs.get('estrai') && !raidDati._estraiAperta) { raidDati._estraiAperta = true; estraiDaRiunione(qs.get('estrai')); }
            // Da «Risultati AI»: proposte arrivate in modalità Batch, da rivedere e salvare.
            if (qs.get('risultato') && qs.get('tab') !== 'cr' && !raidDati._estraiAperta) { raidDati._estraiAperta = true; estraiDaRiunione(null, qs.get('risultato')); }
        }
        // Scelta della persona (owner, decisa da, richiesta da): «Cliente» = Contatti del cliente del
        // progetto, «Interno» = persone del team del progetto (Kick-off, proj_componenti). Gli elenchi
        // si leggono una volta (API /stakeholder/proposte) e stanno in due datalist della pagina; il
        // nome si può sempre scrivere a mano. Si salva il nome (campo di testo).
        const PERSONE = {};
        const ORG_DEF = { rischio: 'team', assunzione: 'team', dipendenza: 'cliente', decisione: 'cliente', change_request: 'cliente' };
        async function caricaPersone() {
            for (const fonte of ['cliente', 'team']) {
                let dl = document.getElementById(`dl-${fonte}`);
                if (!dl) { dl = document.createElement('datalist'); dl.id = `dl-${fonte}`; document.body.appendChild(dl); }
                if (PERSONE[fonte]) continue;
                try {
                    PERSONE[fonte] = await api(`/stakeholder/proposte?projectId=${encodeURIComponent(projectId)}&fonte=${fonte}`);
                    dl.innerHTML = PERSONE[fonte].map((p) => `<option value="${esc(p.nominativo)}">${esc([p.ruolo, p.email].filter(Boolean).join(' · '))}</option>`).join('');
                } catch (e) { PERSONE[fonte] = []; }
            }
        }
        // Se il nome è già in uno dei due elenchi, parte da quello; altrimenti dal default del tipo.
        const fonteDi = (valore, def) => {
            const v = String(valore || '').trim().toLowerCase();
            if (v) for (const f of ['team', 'cliente']) if ((PERSONE[f] || []).some((p) => p.nominativo.toLowerCase() === v)) return f;
            return def;
        };
        function campoPersona(attr, valore, def, extra = '') {
            const fonte = fonteDi(valore, def);
            return `<span class="pm-persona"><select class="pm-input pm-org" title="Da quale elenco scegliere il nome"><option value="cliente" ${fonte === 'cliente' ? 'selected' : ''}>Cliente</option><option value="team" ${fonte === 'team' ? 'selected' : ''}>Interno</option></select><input class="pm-input" ${attr} list="dl-${fonte}" autocomplete="off" value="${esc(valore || '')}" ${extra}></span>`;
        }
        document.addEventListener('change', (e) => {
            if (!e.target.matches || !e.target.matches('.pm-org')) return;
            const inp = e.target.parentElement.querySelector('input');
            if (inp) { inp.setAttribute('list', `dl-${e.target.value}`); inp.focus(); }
        });
        const opzioni15 = (v, etichette) => `<option value="">–</option>${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${Number(v) === n ? 'selected' : ''}>${n} – ${etichette[n - 1]}</option>`).join('')}`;
        const ETICH_P = ['molto bassa', 'bassa', 'media', 'alta', 'molto alta'];
        const ETICH_I = ['trascurabile', 'basso', 'medio', 'alto', 'molto alto'];
        async function formRaid(x) {
            await caricaPersone();
            const nuovo = !x.id;
            const t = x.tipo || 'rischio';
            const sola = !nuovo && x.puoModificare === false;
            const campi = `
                <label>Tipo<select name="tipo">${Object.entries(TIPI).map(([k, v]) => `<option value="${k}" ${k === t ? 'selected' : ''}>${v.label}</option>`).join('')}</select></label>
                <label>Stato<select name="stato">${Object.entries(STATI).map(([k, v]) => `<option value="${k}" ${k === (x.stato || 'aperto') ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
                <label class="largo">Titolo<input name="titolo" value="${esc(x.titolo || '')}" maxlength="500" required></label>
                <label class="largo">Descrizione<textarea name="descrizione">${esc(x.descrizione || '')}</textarea></label>
                <label data-per="rischio">Probabilità<select name="probabilita">${opzioni15(x.probabilita, ETICH_P)}</select></label>
                <label data-per="rischio">Impatto<select name="impatto">${opzioni15(x.impatto, ETICH_I)}</select></label>
                <label data-per="rischio dipendenza assunzione">Owner${campoPersona('name="owner"', x.owner, ORG_DEF[t] || 'team')}</label>
                <label data-per="rischio">Prossima revisione<input type="date" name="data_revisione" value="${esc(x.data_revisione || '')}"></label>
                <label data-per="decisione">Data della decisione<input type="date" name="data_revisione" value="${esc(x.data_revisione || '')}"></label>
                <label data-per="decisione">Decisa da${campoPersona('name="decisa_da"', x.decisa_da, 'cliente')}</label>
                <label class="largo" data-per="rischio decisione"><span data-lbl>Risposta al rischio (come mitigarlo)</span><textarea name="mitigazione">${esc(x.mitigazione || '')}</textarea></label>`;
            const m = modale({
                titolo: `<i class="fas ${TIPI[t].ico}"></i> ${nuovo ? 'Nuovo elemento RAID' : esc(x.codice || TIPI[t].label)}`,
                corpo: `${sola ? '<div class="pm-avviso">Sola lettura: il tuo ruolo non può modificare questo elemento.</div>' : ''}<div class="pm-form">${campi}</div>`,
                pulsanti: [
                    ...(!nuovo && !sola && x.riga_chiusa ? [{ testo: '<i class="fas fa-rotate-left"></i> Riapri', classe: 'verde', azione: async () => { await api(`/raid/${x.id}/riapri?projectId=${encodeURIComponent(projectId)}`, { metodo: 'POST' }); toast('Riga di nuovo nel registro'); caricaRaid(); caricaPanoramica(); } }] : []),
                    ...(!nuovo && !sola && !x.riga_chiusa ? [{ testo: '<i class="fas fa-box-archive"></i> Togli dal registro', classe: 'pericolo', azione: async () => { if (!confirm('Togliere questo elemento dal registro? Non viene cancellato: resta visibile con «anche chiusi (scaduti)» e si può riaprire. Per un rischio superato usa invece lo Stato «Chiuso».')) return false; await api(`/raid/${x.id}?projectId=${encodeURIComponent(projectId)}`, { metodo: 'DELETE' }); toast('Tolto dal registro'); caricaRaid(); caricaPanoramica(); } }] : []),
                    { testo: 'Annulla' },
                    ...(!sola ? [{ testo: '<i class="fas fa-floppy-disk"></i> Salva', classe: 'primario', azione: async (mm) => {
                        const v = valori(mm);
                        const tipo = v.tipo;
                        // Due campi data con lo stesso nome: vale quello visibile per il tipo.
                        const dataVis = [...mm.querySelectorAll('[name="data_revisione"]')].find((el) => el.closest('label').style.display !== 'none');
                        v.data_revisione = dataVis ? dataVis.value : '';
                        if (!v.titolo.trim()) throw new Error('Il titolo è obbligatorio');
                        if (tipo !== 'rischio') { v.probabilita = ''; v.impatto = ''; }
                        const corpo = { ...v, projectId };
                        if (nuovo) await api('/raid', { metodo: 'POST', corpo }); else await api(`/raid/${x.id}`, { metodo: 'PUT', corpo });
                        toast('Salvato'); caricaRaid(); caricaPanoramica();
                    } }] : [])
                ]
            });
            const aggiornaCampi = () => {
                const tipo = m.querySelector('[name="tipo"]').value;
                m.querySelectorAll('[data-per]').forEach((el) => { el.style.display = el.dataset.per.split(' ').includes(tipo) ? '' : 'none'; });
                const lbl = m.querySelector('[data-lbl]');
                if (lbl) lbl.textContent = tipo === 'decisione' ? 'Motivazione e alternative scartate' : 'Risposta al rischio (come mitigarlo)';
            };
            m.querySelector('[name="tipo"]').addEventListener('change', aggiornaCampi);
            aggiornaCampi();
            if (sola) m.querySelectorAll('input, select, textarea').forEach((el) => { el.disabled = true; });
        }

        // soloCr = pulsante della scheda Change Request: solo CR, prompt CR_ESTRAZIONE («AI Funzioni PM»).
        async function estraiDaRiunione(preselezione, risultatoId, soloCr = false) {
            let riunioni;
            try { riunioni = await api(`/riunioni?projectId=${encodeURIComponent(projectId)}`); } catch (e) { toast(e.message, 'errore'); return; }
            if (!riunioni.length) { toast('Nessuna riunione con recap collegata a questo progetto', 'errore'); return; }
            const m = modale({
                titolo: soloCr ? '<i class="fas fa-wand-magic-sparkles"></i> Change Request dalle riunioni' : '<i class="fas fa-wand-magic-sparkles"></i> Rischi, decisioni e Change Request dalle riunioni',
                larga: true,
                corpo: `<p class="pm-nota" style="margin-top:0">${soloCr
                        ? "Scegli una riunione del progetto: l'AI legge il recap (o la trascrizione) e propone le Change Request, cioè le richieste che cambiano lo scope. Rivedi tutto prima di salvare: vengono salvate sempre in <b>Bozza</b>."
                        : "Scegli una riunione del progetto: l'AI legge il recap (o la trascrizione) e propone rischi, decisioni, dipendenze e Change Request. Rivedi tutto prima di salvare: le Change Request vengono salvate sempre in <b>Bozza</b>."}</p>
                    <label class="pm-form" style="display:block"><select class="pm-input" id="selRiunione">${riunioni.map((r) => `<option value="${esc(r.id_calendar)}">${dataIt(r.data)} – ${esc(r.oggetto)}${r.giaEstratta && !soloCr ? ' (già usata)' : ''}${r.haRecap ? '' : ' (solo trascrizione)'}</option>`).join('')}</select></label>
                    <div id="esitoEstrai" style="margin-top:0.9rem"></div>`,
                pulsanti: [{ testo: 'Chiudi' },
                    { testo: '<i class="fas fa-wand-magic-sparkles"></i> Analizza', classe: 'verde', azione: async (mm) => { await analizza(mm); return false; } },
                    { testo: '<i class="fas fa-floppy-disk"></i> Salva selezionati', classe: 'primario', azione: async (mm) => salvaProposte(mm) }]
            });
            let proposte = null, idCal = null;
            if (preselezione) {
                const sel = m.querySelector('#selRiunione');
                if ([...sel.options].some((o) => o.value === preselezione)) { sel.value = preselezione; analizza(m); }
            }
            if (risultatoId) analizza(m);
            async function analizza(mm) {
                const box = mm.querySelector('#esitoEstrai');
                idCal = mm.querySelector('#selRiunione').value;
                box.innerHTML = attesa('L\'AI sta leggendo la riunione…');
                try {
                    // Risultato già pronto (Batch) oppure richiesta all'AI (Impostazioni › AI › «AI Funzioni PM»).
                    const daRisultato = risultatoId;
                    risultatoId = null;
                    const [r] = await Promise.all([
                        daRisultato ? PM.risultatoAi(daRisultato).then((x) => x.risultato || {})
                            : api(soloCr ? '/cr/estrai' : '/raid/estrai', { metodo: 'POST', corpo: { projectId, id_calendar: idCal }, ai: soloCr ? 'pm_cr' : 'pm_raid', titolo: dati && dati.progetto ? dati.progetto.nome : '' }),
                        caricaPersone()]);
                    if (r.batch) { proposte = null; box.innerHTML = `<div class="pm-nota"><i class="fas fa-hourglass-half"></i> ${esc(r.messaggio)}</div>`; return; }
                    if (daRisultato && r.riunione) {
                        idCal = r.riunione.id_calendar;
                        const sel = mm.querySelector('#selRiunione');
                        if ([...sel.options].some((o) => o.value === idCal)) sel.value = idCal;
                    }
                    proposte = r.elementi;
                    if (!proposte.length) { box.innerHTML = `<div class="pm-vuoto">L'AI non ha trovato ${soloCr ? 'Change Request' : 'rischi, decisioni, dipendenze o Change Request'} in questa riunione.</div>`; return; }
                    const eCr = (x) => x.tipo === 'change_request';
                    const persona = (x) => (eCr(x) ? 'richiesta_da' : x.tipo === 'decisione' ? 'decisa_da' : 'owner');
                    const ETICH_PERSONA = { owner: 'Owner', decisa_da: 'Decisa da', richiesta_da: 'Richiesta da' };
                    box.innerHTML = `<div class="pm-nota">Proposte di ${esc(r.ai)} · togli la spunta a quelle da non salvare, correggi titoli e valori. Per le Change Request: effort (${esc(unita)}) e slittamento in giorni solo se detti in riunione.</div>
                        <div class="pm-scroll"><table class="pm-t"><thead><tr><th></th><th>Tipo</th><th>Titolo e dettaglio</th><th>Probabilità · effort</th><th>Impatto · giorni</th><th title="Una sola persona per riga: per Rischio e Dipendenza l'owner, per Decisione chi ha deciso, per Change Request chi l'ha richiesta">Persona</th></tr></thead><tbody>
                        ${proposte.map((x, i) => `<tr><td><input type="checkbox" data-i="${i}" ${x.esiste ? '' : 'checked'}></td><td><span class="pill${eCr(x) ? ' bozza' : ''}">${eCr(x) ? 'Change Request' : TIPI[x.tipo].label}</span>${eCr(x) ? '<div class="pm-nota">in bozza</div>' : ''}${x.esiste ? '<div class="pm-nota">già presente</div>' : ''}</td>
                            <td><input class="pm-input" data-c="titolo" data-i="${i}" value="${esc(x.titolo)}"><div class="pm-nota">${esc(x.descrizione)}${x.mitigazione ? ` · Risposta: ${esc(x.mitigazione)}` : ''}${x.motivo ? ` · Motivo: ${esc(x.motivo)}` : ''}</div></td>
                            <td>${x.tipo === 'rischio' ? `<select class="pm-input" data-c="probabilita" data-i="${i}">${opzioni15(x.probabilita, ETICH_P)}</select>` : eCr(x) ? `<input class="pm-input" data-c="effort_delta" data-i="${i}" value="${x.effort_delta ?? ''}" placeholder="non detto" inputmode="decimal">` : ''}</td>
                            <td>${x.tipo === 'rischio' ? `<select class="pm-input" data-c="impatto" data-i="${i}">${opzioni15(x.impatto, ETICH_I)}</select>` : eCr(x) ? `<input class="pm-input" data-c="giorni_delta" data-i="${i}" value="${x.giorni_delta ?? ''}" placeholder="non detto" inputmode="numeric">` : ''}</td>
                            <td style="min-width:260px">${campoPersona(`data-c="${persona(x)}" data-i="${i}"`, x[persona(x)], ORG_DEF[x.tipo] || 'team', `placeholder="${ETICH_PERSONA[persona(x)]}" title="${ETICH_PERSONA[persona(x)]}${x.tipo === 'rischio' ? ': chi segue il rischio e la sua risposta' : x.tipo === 'dipendenza' ? ': da chi dipendete (chi deve consegnare)' : ''}"`)}</td></tr>`).join('')}
                        </tbody></table></div>`;
                } catch (e) { box.innerHTML = errore(e); }
            }
            async function salvaProposte(mm) {
                if (!proposte) throw new Error('Prima premi «Analizza»');
                mm.querySelectorAll('[data-c]').forEach((el) => { proposte[el.dataset.i][el.dataset.c] = el.value; });
                const scelti = [...mm.querySelectorAll('input[type="checkbox"][data-i]:checked')].map((c) => proposte[c.dataset.i]);
                if (!scelti.length) throw new Error('Nessun elemento selezionato');
                const r = await api('/raid/importa', { metodo: 'POST', corpo: { projectId, id_calendar: idCal, elementi: scelti } });
                toast(soloCr ? `${r.changeRequest} Change Request salvate in bozza` : r.changeRequest ? `${r.creati} elementi salvati, di cui ${r.changeRequest} Change Request in bozza` : `${r.creati} elementi aggiunti al registro`);
                if (caricati.raid) caricaRaid();
                caricaPanoramica();
                if (r.changeRequest && caricati.cr) caricaCr(); // scheda Change Request già aperta: si aggiorna
            }
        }

        // ================= CHANGE REQUEST =================
        let crDati = null, crEstraiAperta = false;
        const STATI_CR = { bozza: 'Bozza', inviata: 'Inviata al cliente', approvata: 'Approvata', rifiutata: 'Rifiutata' };
        async function caricaCr() {
            const p = pannello('cr');
            p.innerHTML = attesa('Carico le Change Request…');
            try { crDati = await api(`/cr?projectId=${encodeURIComponent(projectId)}`); renderCr(p); } catch (e) { p.innerHTML = errore(e); }
        }
        function renderCr(p) {
            const l = crDati.cr, u = crDati.unita;
            const app = l.filter((x) => x.stato === 'approvata');
            const somma = (arr, k) => arr.reduce((s, x) => s + (Number(x[k]) || 0), 0);
            p.innerHTML = `${crDati.tabelle ? '' : sqlMancante()}
                <div class="pm-card">
                    <h2><i class="fas fa-code-pull-request"></i> Change Request <span class="azioni"><button class="pm-btn piccolo verde" id="btnEstraiCr" title="L'AI legge il recap di una riunione e propone le Change Request (in bozza)"><i class="fas fa-wand-magic-sparkles"></i> Estrai dalle riunioni</button><button class="pm-btn piccolo primario" id="nuovaCr"><i class="fas fa-plus"></i> Nuova Change Request</button></span></h2>
                    <div class="pm-kpi" style="margin-bottom:0.9rem">
                        <div><small>Approvate</small><b>${app.length}</b></div>
                        <div><small>Effort approvato</small><b>${somma(app, 'effort_delta') > 0 ? '+' : ''}${fmt(somma(app, 'effort_delta'))} ${esc(u)}</b></div>
                        <div><small>Importo approvato</small><b>${euro(somma(app, 'importo_delta'))}</b></div>
                        <div><small>Slittamento approvato</small><b>${somma(app, 'giorni_delta')} gg</b></div>
                        <div><small>In attesa</small><b>${l.filter((x) => x.stato === 'bozza' || x.stato === 'inviata').length}</b></div>
                    </div>
                    ${l.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr><th>Codice</th><th>Titolo</th><th>Stato</th><th>Richiesta</th><th class="n">Effort (${esc(u)})</th><th class="n">Importo</th><th class="n">Tempi</th><th>Decisione</th></tr></thead><tbody>
                        ${l.map((x) => `<tr class="click" data-id="${esc(x.id)}"><td><b>${esc(x.codice || '')}</b></td><td><b>${esc(x.titolo)}</b>${x.motivo ? `<div class="pm-nota">${esc(x.motivo)}</div>` : ''}</td><td><span class="pill ${x.stato}">${STATI_CR[x.stato]}</span></td><td>${dataIt(x.data_richiesta)}${x.richiesta_da ? `<div class="pm-nota">${esc(x.richiesta_da)}</div>` : ''}</td><td class="n">${x.effort_delta != null ? `${x.effort_delta > 0 ? '+' : ''}${fmt(x.effort_delta)}` : '–'}</td><td class="n">${euro(x.importo_delta)}</td><td class="n">${x.giorni_delta != null ? `${x.giorni_delta > 0 ? '+' : ''}${x.giorni_delta} gg` : '–'}</td><td>${dataIt(x.data_decisione)}</td></tr>`).join('')}
                    </tbody></table></div>` : '<div class="pm-vuoto">Nessuna Change Request. Registra qui ogni richiesta del cliente che cambia lo scope: le CR approvate aumentano il budget usato per la salute e la previsione a finire.</div>'}
                </div>`;
            p.querySelector('#nuovaCr').addEventListener('click', () => formCr({}));
            p.querySelector('#btnEstraiCr').addEventListener('click', () => estraiDaRiunione(null, null, true));
            // Da «Risultati AI»: Change Request arrivate in modalità Batch, da rivedere e salvare.
            if (qs.get('tab') === 'cr' && qs.get('risultato') && !crEstraiAperta) { crEstraiAperta = true; estraiDaRiunione(null, qs.get('risultato'), true); }
            p.querySelectorAll('tr.click').forEach((tr) => tr.addEventListener('click', () => formCr(l.find((x) => x.id === tr.dataset.id))));
        }
        async function formCr(x) {
            await caricaPersone();
            const nuovo = !x.id;
            const sola = !nuovo && x.puoModificare === false;
            const m = modale({
                titolo: `<i class="fas fa-code-pull-request"></i> ${nuovo ? 'Nuova Change Request' : esc(`${x.codice || ''} ${x.titolo}`)}`,
                corpo: `${sola ? '<div class="pm-avviso">Sola lettura: il tuo ruolo non può modificare questa Change Request.</div>' : ''}<div class="pm-form">
                    <label class="largo">Titolo<input name="titolo" value="${esc(x.titolo || '')}"></label>
                    <label class="largo">Descrizione della modifica<textarea name="descrizione">${esc(x.descrizione || '')}</textarea></label>
                    <label class="largo">Motivo<textarea name="motivo" style="min-height:50px">${esc(x.motivo || '')}</textarea></label>
                    <label>Richiesta da${campoPersona('name="richiesta_da"', x.richiesta_da, 'cliente')}</label>
                    <label>Data richiesta<input type="date" name="data_richiesta" value="${esc(x.data_richiesta || dati?.oggi || '')}"></label>
                    <label>Effort in più (${esc(crDati.unita)}, negativo se in meno)<input name="effort_delta" value="${x.effort_delta ?? ''}" inputmode="decimal"></label>
                    <label>Importo in più (€)<input name="importo_delta" value="${x.importo_delta ?? ''}" inputmode="decimal"></label>
                    <label>Slittamento della fine (giorni)<input name="giorni_delta" value="${x.giorni_delta ?? ''}" inputmode="numeric"></label>
                    <label>Stato<select name="stato">${Object.entries(STATI_CR).map(([k, v]) => `<option value="${k}" ${k === (x.stato || 'bozza') ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
                    <label>Data decisione del cliente<input type="date" name="data_decisione" value="${esc(x.data_decisione || '')}"></label>
                    <label class="largo">Note<textarea name="note" style="min-height:50px">${esc(x.note || '')}</textarea></label></div>
                    <p class="pm-nota">Approvata o rifiutata senza data: Projexa mette la data di oggi. Le CR approvate sommano effort, importo e giorni al budget del progetto nel Cruscotto (la scheda e i Costi Progetto non vengono modificati).</p>`,
                pulsanti: [
                    ...(!nuovo && !sola ? [{ testo: '<i class="fas fa-trash"></i> Elimina', classe: 'pericolo', azione: async () => { if (!confirm('Eliminare questa Change Request?')) return false; await api(`/cr/${x.id}?projectId=${encodeURIComponent(projectId)}`, { metodo: 'DELETE' }); toast('Eliminata'); caricaCr(); caricaPanoramica(); } }] : []),
                    { testo: 'Annulla' },
                    ...(!sola ? [{ testo: '<i class="fas fa-floppy-disk"></i> Salva', classe: 'primario', azione: async (mm) => {
                        const v = { ...valori(mm), projectId };
                        if (!v.titolo.trim()) throw new Error('Il titolo è obbligatorio');
                        if (nuovo) await api('/cr', { metodo: 'POST', corpo: v }); else await api(`/cr/${x.id}`, { metodo: 'PUT', corpo: v });
                        toast('Change Request salvata'); caricaCr(); caricaPanoramica();
                    } }] : [])
                ]
            });
            if (sola) m.querySelectorAll('input, select, textarea').forEach((el) => { el.disabled = true; });
        }

        // ================= ECONOMIA (valore in euro, margine, costi esterni, valuta) =================
        // API /api/pm/economia (backend/config/pmEconomia.js). Earned Value in euro: il valore
        // viene dalle tariffe dei Costi Progetto (prezzo al cliente); il margine dal costo
        // interno delle voci e dai costi esterni.
        let ecoDati = null;
        async function caricaEconomia() {
            const p = pannello('economia');
            if (!ecoDati) p.innerHTML = attesa('Calcolo l\'economia del progetto…');
            try { ecoDati = await api(`/economia?projectId=${encodeURIComponent(projectId)}`); renderEconomia(p); } catch (e) { p.innerHTML = errore(e); }
        }
        const ecoSqlMancante = () => '<div class="pm-avviso"><i class="fas fa-database"></i> Costi interni, costi esterni e valuta non sono ancora attivi: va eseguito lo script <b>Supporto/CreaDB/pm_economia.sql</b> sul database. Il valore guadagnato (CPI e SPI) si vede già.</div>';
        // Indici: 1 = in linea. Sopra 0,95 verde, fino a 0,85 giallo, sotto rosso.
        const statoIndice = (v) => (v == null ? 'nd' : v >= 0.95 ? 'verde' : v >= 0.85 ? 'giallo' : 'rosso');

        function renderEconomia(p) {
            const d = ecoDati, e = d.ev, m = d.margine, imp = d.impostazioni;
            const u = d.unita === 'ore' ? 'ore' : 'gg';
            const val = imp.valuta && imp.valuta !== 'EUR' && imp.cambio ? imp : null;
            // Importo in euro + (se c'è) l'equivalente nella valuta del contratto.
            const eur = (v) => (v == null ? '–' : `${euro(v)}${val ? `<em class="eco-val">${fmt(v * val.cambio, 0)} ${esc(val.valuta)}</em>` : ''}`);
            const tile = (titolo, valore, spiega, stato = '') => `<div class="eco-tile${stato ? ` eco-${stato}` : ''}"><small>${titolo}</small><b>${valore}</b>${spiega ? `<span>${spiega}</span>` : ''}</div>`;
            const perc = (v) => (v == null ? '' : ` (${fmt(v, 1)}%)`);
            const grigio = !e.affidabile;

            // Avvisi sui dati che mancano.
            const note = [];
            if (!e.bac) note.push('Nei Costi Progetto mancano effort offerto e tariffe (e la scheda non ha l\'Importo): senza budget non si calcola il valore guadagnato.');
            if (e.bac && e.completamento == null) note.push('Manca il <b>Completamento</b> del progetto (scheda o Gantt): senza, non si sa quanto lavoro è stato fatto e CPI/SPI non si calcolano.');
            if (e.bac && !e.piano) note.push('Mancano le date del piano (Gantt o Start/End della scheda): lo SPI non si calcola.');
            if (e.piano && e.piano.fonte === 'gantt') note.push('Lo SPI usa le date <b>attuali</b> del Gantt: congela la baseline nel Gantt per misurare il ritardo rispetto al piano approvato.');
            if (e.piano && e.piano.fonte === 'scheda') note.push('Senza Gantt il piano è una crescita uniforme fra Start ed End della scheda.');
            if (e.fonteBudget === 'importo') note.push('Le voci dei Costi Progetto non hanno tariffe: come budget si usa l\'Importo della scheda.');
            if (grigio && e.completamento != null) note.push('Completamento sotto il 15%: gli indici oscillano molto, leggili come indicazione.');

            const cpiTesto = e.cpi == null ? 'Non calcolabile' : `Ogni euro consumato produce <b>${fmt(e.cpi * 100, 0)} centesimi</b> di lavoro`;
            const spiTesto = e.spi == null ? 'Non calcolabile' : `Il lavoro fatto è il <b>${fmt(e.spi * 100, 0)}%</b> di quello previsto a oggi`;
            const vacTesto = e.vac == null ? '' : e.vac < 0 ? `Si finirebbe <b>${euro(-e.vac)}</b> sopra il budget` : `Si finirebbe <b>${euro(e.vac)}</b> sotto il budget`;
            const tcpiTesto = e.tcpi == null ? '' : e.tcpi > 1 ? `Per restare nel budget, da qui in poi ogni euro deve rendere ${fmt(e.tcpi * 100, 0)} centesimi` : 'Il budget residuo basta anche con l\'efficienza attuale';

            const indici = `<div class="pm-card">
                <h2><i class="fas fa-scale-balanced"></i> Valore guadagnato (Earned Value)</h2>
                <div class="eco-indici">
                    ${tile('CPI · costi', e.cpi == null ? '–' : fmt(e.cpi, 2), cpiTesto, grigio ? 'nd' : statoIndice(e.cpi))}
                    ${tile('SPI · tempi', e.spi == null ? '–' : fmt(e.spi, 2), spiTesto, grigio ? 'nd' : statoIndice(e.spi))}
                    ${tile('Stima a finire', eur(e.eac), vacTesto, e.vac == null || grigio ? '' : e.vac < 0 ? 'rosso' : 'verde')}
                </div>
                <div class="eco-griglia">
                    ${tile('Budget (BAC)', eur(e.bac), e.crImporto ? `di cui CR approvate ${euro(e.crImporto)}` : (e.fonteBudget === 'importo' ? 'dall\'Importo della scheda' : 'effort offerto × tariffe'))}
                    ${tile('Pianificato a oggi (PV)', eur(e.pv), e.pvPerc != null ? `${fmt(e.pvPerc, 0)}% del lavoro previsto` : '')}
                    ${tile('Guadagnato (EV)', eur(e.ev), e.completamento != null ? `completamento ${fmt(e.completamento, 0)}%${e.fonteCompletamento === 'gantt' ? ' (dal Gantt)' : ''}` : '')}
                    ${tile('Consumato (AC)', eur(e.ac), `${fmt(d.effort.speso)} ${u} × tariffa`)}
                    ${tile('Da spendere a finire', eur(e.etc), tcpiTesto)}
                </div>
                ${note.length ? `<ul class="eco-note">${note.map((x) => `<li>${x}</li>`).join('')}</ul>` : ''}
                <details class="eco-spiega"><summary>Come si leggono</summary>
                    <p><b>CPI</b> = guadagnato ÷ consumato: sotto 1 si spende più di quanto si produce. <b>SPI</b> = guadagnato ÷ pianificato: sotto 1 si è in ritardo sul piano. <b>Stima a finire</b> = budget ÷ CPI, cioè quanto costerà il progetto se l'efficienza resta questa. Il valore è a prezzo cliente (tariffe dei Costi Progetto); il margine è nel riquadro sotto.</p>
                </details>
            </div>`;

            const curva = `<div class="pm-card"><h2><i class="fas fa-chart-line"></i> Curva a S: pianificato, guadagnato, consumato</h2>${curvaS(d)}</div>`;

            const scontoTesto = e.sconto == null || Math.abs(e.sconto) < 1 ? '' : e.sconto > 0 ? `sconto di ${euro(e.sconto)} sul valore a tariffa` : `${euro(-e.sconto)} sopra il valore a tariffa`;
            const margine = `<div class="pm-card">
                <h2><i class="fas fa-sack-dollar"></i> Margine</h2>
                <div class="eco-griglia">
                    ${tile('Ricavo', eur(m.ricavo), m.fonteRicavo === 'importo' ? `Importo della scheda${e.crImporto ? ' + CR approvate' : ''}${scontoTesto ? ` · ${scontoTesto}` : ''}` : 'valore a tariffa (manca l\'Importo)')}
                    ${tile('Costo previsto', eur(m.costoPrevisto), m.costoPrevisto == null ? 'imposta i costi interni delle voci' : `interno ${euro(m.interni.previsto)} + esterni ${euro(m.esterni.previsto)}`)}
                    ${tile('Margine previsto', m.previsto == null ? '–' : `${eur(m.previsto)}`, m.previsto == null ? '' : `${fmt(m.previstoPerc, 1)}% del ricavo`, m.previsto == null ? '' : m.previsto < 0 ? 'rosso' : m.previstoPerc < 10 ? 'giallo' : 'verde')}
                    ${tile('Costo a finire', eur(m.costoAFinire), m.costoAFinire == null ? '' : `speso finora ${euro(m.costoSpeso)}`)}
                    ${tile('Margine a finire', m.aFinire == null ? '–' : eur(m.aFinire), m.aFinire == null ? '' : `${fmt(m.aFinirePerc, 1)}% del ricavo`, m.aFinire == null ? '' : m.aFinire < 0 ? 'rosso' : m.aFinirePerc < 10 ? 'giallo' : 'verde')}
                </div>
                ${m.vociSenzaCosto ? `<p class="pm-nota"><i class="fas fa-circle-info"></i> ${m.vociSenzaCosto} ${m.vociSenzaCosto === 1 ? 'voce non ha' : 'voci non hanno'} il costo interno: scrivilo nella tabella sotto per un margine completo.</p>` : ''}
                <p class="pm-nota">Costo a finire: il costo interno speso proiettato sul completamento, più i costi esterni (il maggiore fra previsto ed effettivo). L'effort delle CR approvate entra al costo interno medio.</p>
            </div>`;

            const scrivibile = d.tabelle;
            const voci = d.voci.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr><th>Voce</th><th class="n">Offerta (${u})</th><th class="n">Speso (${u})</th><th class="n">Tariffa</th><th class="n">Valore offerto</th><th class="n">Valore consumato</th><th class="n" title="Costo interno di un'unità (giornata o ora): vale per tutti i tuoi progetti">Costo interno</th><th class="n">Costo previsto</th><th class="n">Margine</th></tr></thead><tbody>
                ${d.voci.map((v, i) => `<tr><td><b>${esc(v.voce)}</b></td><td class="n">${fmt(v.offerta)}</td><td class="n">${fmt(v.speso)}</td><td class="n">${v.tariffa != null ? `${euro(v.tariffa)}/${v.hh ? 'h' : 'gg'}` : '–'}</td><td class="n">${euro(v.valoreOfferto)}</td><td class="n">${euro(v.valoreSpeso)}</td>
                    <td class="n"><input class="pm-input eco-costo" data-i="${i}" inputmode="decimal" placeholder="€/${v.hh ? 'h' : 'gg'}" value="${v.costoUnita != null ? fmt(v.costoUnita, 2) : ''}" ${scrivibile ? '' : 'disabled'} title="Costo interno per ${v.hh ? 'ora' : 'giornata'}: premi Invio o esci dal campo per salvare"></td>
                    <td class="n">${euro(v.costoPrevisto)}</td><td class="n">${v.margine == null ? '–' : `${euro(v.margine)}${perc(v.marginePerc)}`}</td></tr>`).join('')}
                </tbody></table></div>
                <p class="pm-nota">Le tariffe sono il prezzo al cliente (Costi Progetto). Il <b>costo interno</b> di una voce vale per tutti i tuoi progetti con quella voce.</p>`
                : '<div class="pm-vuoto">Nessuna voce nei Costi Progetto.</div>';

            const est = d.esterni;
            const esterni = `<div class="pm-card">
                <h2><i class="fas fa-truck-ramp-box"></i> Costi esterni <span class="azioni"><button class="pm-btn piccolo primario" id="ecoNuovoEst" ${scrivibile ? '' : 'disabled'}><i class="fas fa-plus"></i> Costo esterno</button></span></h2>
                ${est.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr><th>Data</th><th>Categoria</th><th>Descrizione</th><th>Fornitore</th><th class="n">Previsto</th><th class="n">Effettivo</th></tr></thead><tbody>
                    ${est.map((x) => `<tr class="click" data-id="${esc(x.id)}"><td>${dataIt(x.data)}</td><td><span class="pill">${esc(x.categoriaLabel)}</span></td><td><b>${esc(x.descrizione)}</b>${x.note ? `<div class="pm-nota">${esc(x.note)}</div>` : ''}</td><td>${esc(x.fornitore || '')}</td><td class="n">${euro(x.previsto)}</td><td class="n">${euro(x.effettivo)}</td></tr>`).join('')}
                    <tr><td colspan="4"><b>Totale</b></td><td class="n"><b>${euro(m.esterni.previsto)}</b></td><td class="n"><b>${euro(m.esterni.effettivo)}</b></td></tr>
                    </tbody></table></div>`
                : '<div class="pm-vuoto">Nessun costo esterno. Registra qui fornitori, subappalti, trasferte e licenze del progetto: entrano nel margine.</div>'}
            </div>`;

            const valuta = `<div class="pm-card">
                <h2><i class="fas fa-coins"></i> Valuta del contratto</h2>
                <div class="eco-valuta">
                    <label>Valuta <select class="pm-input" id="ecoValuta" ${scrivibile ? '' : 'disabled'}>${imp.valute.map((x) => `<option ${x === imp.valuta ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
                    <label id="ecoCambioWrap" style="${imp.valuta === 'EUR' ? 'display:none' : ''}">1 EUR = <input class="pm-input" id="ecoCambio" inputmode="decimal" style="width:8rem" value="${imp.cambio != null ? String(imp.cambio).replace('.', ',') : ''}" ${scrivibile ? '' : 'disabled'}> <span id="ecoCambioCod">${esc(imp.valuta)}</span></label>
                    <button class="pm-btn piccolo primario" id="ecoSalvaValuta" ${scrivibile ? '' : 'disabled'}><i class="fas fa-floppy-disk"></i> Salva</button>
                </div>
                <p class="pm-nota">I dati di Projexa sono in euro: con una valuta diversa, ogni importo mostra sotto anche il valore nella valuta del contratto, al cambio indicato.</p>
            </div>`;

            p.innerHTML = `${scrivibile ? '' : ecoSqlMancante()}${indici}${curva}
                <div class="pm-griglia" style="margin-top:1rem">${margine}${valuta}</div>
                <div class="pm-card" style="margin-top:1rem"><h2><i class="fas fa-users-gear"></i> Voci dei Costi Progetto</h2>${voci}</div>
                ${esterni}`;

            // Costo interno: si salva all'uscita dal campo o con Invio.
            p.querySelectorAll('.eco-costo').forEach((inp) => {
                const salva = async () => {
                    const v = d.voci[inp.dataset.i];
                    const vecchio = v.costoUnita != null ? fmt(v.costoUnita, 2) : '';
                    if (inp.value.trim() === vecchio) return;
                    try {
                        await api('/economia/costo-interno', { metodo: 'PUT', corpo: { voce: v.voce, [v.hh ? 'costo_hh' : 'costo_gg']: inp.value.trim() } });
                        toast(inp.value.trim() ? 'Costo interno salvato' : 'Costo interno tolto');
                        caricaEconomia();
                    } catch (e) { toast(e.message, 'errore'); }
                };
                inp.addEventListener('change', salva);
                inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); } });
            });
            p.querySelector('#ecoNuovoEst')?.addEventListener('click', () => formEsterno({}));
            p.querySelectorAll('tr.click[data-id]').forEach((tr) => tr.addEventListener('click', () => formEsterno(est.find((x) => x.id === tr.dataset.id))));
            const selV = p.querySelector('#ecoValuta');
            selV?.addEventListener('change', () => {
                p.querySelector('#ecoCambioWrap').style.display = selV.value === 'EUR' ? 'none' : '';
                p.querySelector('#ecoCambioCod').textContent = selV.value;
            });
            p.querySelector('#ecoSalvaValuta')?.addEventListener('click', async () => {
                try {
                    await api('/economia/impostazioni', { metodo: 'PUT', corpo: { projectId, valuta: selV.value, cambio: p.querySelector('#ecoCambio').value } });
                    toast('Valuta salvata');
                    caricaEconomia();
                } catch (e) { toast(e.message, 'errore'); }
            });
        }

        // Curva a S in SVG: pianificato (piano/baseline), guadagnato e consumato nel tempo.
        function curvaS(d) {
            const e = d.ev, piano = d.curva.piano, storia = d.curva.storia;
            if (!e.bac || (!piano.length && storia.length < 2)) return '<div class="pm-vuoto">La curva compare quando il progetto ha budget e date del piano (Gantt o Start/End).</div>';
            const W = 900, H = 260, L = 70, R = 16, T = 14, B = 34;
            const ms = (iso) => Date.parse(`${iso}T00:00:00Z`);
            const date = [...piano.map((x) => x.d), ...storia.map((x) => x.d)];
            const x0 = Math.min(...date.map(ms)), x1 = Math.max(...date.map(ms), x0 + 86400000);
            const ymax = Math.max(e.bac, ...storia.map((x) => Math.max(x.ac || 0, x.ev || 0))) * 1.08;
            const X = (iso) => L + ((ms(iso) - x0) / (x1 - x0)) * (W - L - R);
            const Y = (v) => T + (1 - v / ymax) * (H - T - B);
            const linea = (punti, cls) => (punti.length > 1 ? `<polyline class="${cls}" points="${punti.map((p) => `${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}"/>` : '');
            const pv = piano.map((x) => ({ d: x.d, v: x.v }));
            const ev = storia.filter((x) => x.ev != null).map((x) => ({ d: x.d, v: x.ev }));
            const ac = storia.filter((x) => x.ac != null).map((x) => ({ d: x.d, v: x.ac }));
            const tacche = [0, 0.25, 0.5, 0.75, 1].map((f) => f * e.bac);
            const oggiX = X(d.oggi);
            const punto = (arr, cls) => (arr.length ? `<circle class="${cls}" cx="${X(arr[arr.length - 1].d).toFixed(1)}" cy="${Y(arr[arr.length - 1].v).toFixed(1)}" r="4"/>` : '');
            const stimate = storia.some((x) => x.stimata && x.d !== d.oggi);
            return `<svg class="eco-curva" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva a S del progetto">
                    ${tacche.map((v) => `<line class="griglia" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="asse" x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v / 1000, 0)}k</text>`).join('')}
                    <line class="bac" x1="${L}" x2="${W - R}" y1="${Y(e.bac).toFixed(1)}" y2="${Y(e.bac).toFixed(1)}"/>
                    <line class="oggi" x1="${oggiX.toFixed(1)}" x2="${oggiX.toFixed(1)}" y1="${T}" y2="${H - B}"/>
                    <text class="asse" x="${oggiX.toFixed(1)}" y="${H - B + 14}" text-anchor="middle">oggi</text>
                    <text class="asse" x="${L}" y="${H - 6}">${dataIt(new Date(x0).toISOString().slice(0, 10))}</text>
                    <text class="asse" x="${W - R}" y="${H - 6}" text-anchor="end">${dataIt(new Date(x1).toISOString().slice(0, 10))}</text>
                    ${linea(pv, 'pv')}${linea(ac, 'ac')}${linea(ev, 'ev')}${punto(ac, 'ac-p')}${punto(ev, 'ev-p')}
                </svg>
                <div class="pm-legenda"><span><i style="background:#6366F1"></i>Pianificato (PV)</span><span><i style="background:#059669"></i>Guadagnato (EV)</span><span><i style="background:#DC2626"></i>Consumato (AC)</span><span><i style="background:#111827"></i>Budget (BAC)</span></div>
                ${stimate ? '<p class="pm-nota">I giorni prima dell\'attivazione dei valori in euro sono stimati dalle ore spese alla tariffa media di oggi.</p>' : ''}
                ${storia.length < 3 ? '<p class="pm-nota">Guadagnato e consumato si allungano giorno per giorno con la fotografia giornaliera del server.</p>' : ''}`;
        }

        function formEsterno(x) {
            const nuovo = !x.id;
            const sola = !nuovo && x.puoModificare === false;
            const cat = ecoDati.categorie || {};
            const m = modale({
                titolo: `<i class="fas fa-truck-ramp-box"></i> ${nuovo ? 'Nuovo costo esterno' : esc(x.descrizione)}`,
                corpo: `${sola ? '<div class="pm-avviso">Sola lettura: il tuo ruolo non può modificare questo costo.</div>' : ''}<div class="pm-form">
                    <label>Categoria<select name="categoria">${Object.entries(cat).map(([k, v]) => `<option value="${k}" ${k === (x.categoria || 'fornitore') ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
                    <label>Data<input type="date" name="data" value="${esc(x.data || '')}"></label>
                    <label class="largo">Descrizione<input name="descrizione" value="${esc(x.descrizione || '')}" placeholder="es. Sviluppo integrazione SAP, volo Milano-Londra, licenze 2027"></label>
                    <label class="largo">Fornitore<input name="fornitore" value="${esc(x.fornitore || '')}"></label>
                    <label>Previsto (€)<input name="previsto" inputmode="decimal" value="${x.previsto != null ? String(x.previsto).replace('.', ',') : ''}"></label>
                    <label>Effettivo (€)<input name="effettivo" inputmode="decimal" value="${x.effettivo != null ? String(x.effettivo).replace('.', ',') : ''}"></label>
                    <label class="largo">Note<textarea name="note">${esc(x.note || '')}</textarea></label>
                </div>`,
                pulsanti: [
                    ...(!nuovo && !sola ? [{ testo: '<i class="fas fa-trash"></i> Elimina', classe: 'pericolo', azione: async () => {
                        await api(`/economia/esterni/${encodeURIComponent(x.id)}?projectId=${encodeURIComponent(projectId)}`, { metodo: 'DELETE' });
                        toast('Costo eliminato'); caricaEconomia();
                    } }] : []),
                    { testo: 'Annulla' },
                    ...(sola ? [] : [{ testo: '<i class="fas fa-floppy-disk"></i> Salva', classe: 'primario', azione: async (mm) => {
                        const b = { ...valori(mm), projectId };
                        if (nuovo) await api('/economia/esterni', { metodo: 'POST', corpo: b });
                        else await api(`/economia/esterni/${encodeURIComponent(x.id)}`, { metodo: 'PUT', corpo: b });
                        toast('Costo salvato'); caricaEconomia();
                    } }])
                ]
            });
            if (sola) m.querySelectorAll('input, select, textarea').forEach((el) => { el.disabled = true; });
        }

        // ================= STAKEHOLDER E RACI =================
        let stkDati = null;
        const ORG = { cliente: 'Cliente', interno: 'Interno', fornitore: 'Fornitore' };
        async function caricaStakeholder() {
            const p = pannello('stakeholder');
            p.innerHTML = attesa('Carico gli stakeholder…');
            try { stkDati = await api(`/stakeholder?projectId=${encodeURIComponent(projectId)}`); renderStakeholder(p); } catch (e) { p.innerHTML = errore(e); }
        }
        function quadrante(s) {
            const inf = s.influenza || 0, int = s.interesse || 0;
            if (!inf || !int) return 'da valutare';
            if (inf >= 3 && int >= 3) return 'gestire da vicino';
            if (inf >= 3) return 'tenere soddisfatto';
            if (int >= 3) return 'tenere informato';
            return 'monitorare';
        }
        function renderStakeholder(p) {
            const l = stkDati.stakeholder;
            const punti = l.filter((s) => s.influenza && s.interesse).map((s) => `<span class="pt" style="left:${((s.interesse - 0.5) / 5) * 100}%; bottom:${((s.influenza - 0.5) / 5) * 100}%" title="${esc(s.nominativo)}: influenza ${s.influenza}, interesse ${s.interesse}">${esc(s.nominativo.split(' ')[0])}</span>`).join('');
            p.innerHTML = `${stkDati.tabelle ? '' : sqlMancante()}
                <div class="pm-griglia">
                    <div class="pm-card" style="grid-column: span 2; min-width:0">
                        <h2><i class="fas fa-users"></i> Stakeholder <span class="azioni"><button class="pm-btn piccolo primario" id="nuovoStk"><i class="fas fa-plus"></i> Stakeholder</button></span></h2>
                        ${l.length ? `<div class="pm-scroll"><table class="pm-t"><thead><tr><th>Nominativo</th><th>Ruolo</th><th>Organizzazione</th><th class="n">Influenza</th><th class="n">Interesse</th><th>Strategia</th><th>Comunicazione</th></tr></thead><tbody>
                        ${l.map((s) => `<tr class="click" data-id="${esc(s.id)}"><td><b>${esc(s.nominativo)}</b>${s.email ? `<div class="pm-nota">${esc(s.email)}</div>` : ''}</td><td>${esc(s.ruolo || '')}</td><td>${ORG[s.organizzazione] || ''}</td><td class="n">${s.influenza || '–'}</td><td class="n">${s.interesse || '–'}</td><td><span class="pill">${quadrante(s)}</span>${s.strategia ? `<div class="pm-nota">${esc(s.strategia)}</div>` : ''}</td><td>${esc(s.comunicazione || '')}</td></tr>`).join('')}</tbody></table></div>`
                        : '<div class="pm-vuoto">Nessuno stakeholder: aggiungi sponsor, key user, referenti IT del cliente e le persone interne.</div>'}
                    </div>
                    <div class="pm-card">
                        <h2><i class="fas fa-border-all"></i> Influenza / interesse</h2>
                        <div class="matrice"><div class="q q1">Tenere soddisfatti</div><div class="q q2">Gestire da vicino</div><div class="q q3">Monitorare</div><div class="q q4">Tenere informati</div>${punti}</div>
                        <div class="pm-nota" style="margin-top:0.3rem">↑ influenza · → interesse</div>
                    </div>
                </div>
                <div class="pm-card" style="margin-top:1rem">
                    <h2><i class="fas fa-table-cells"></i> Matrice RACI <span class="azioni"><button class="pm-btn piccolo" id="raciRiga"><i class="fas fa-plus"></i> Attività</button><button class="pm-btn piccolo primario" id="raciSalva"><i class="fas fa-floppy-disk"></i> Salva matrice</button></span></h2>
                    <p class="pm-nota" style="margin-top:0">R = esegue · A = responsabile finale (uno solo per riga) · C = consultato · I = informato.</p>
                    <div class="pm-scroll" id="raciBox"></div>
                </div>`;
            p.querySelector('#nuovoStk').addEventListener('click', () => formStk({}));
            p.querySelectorAll('tr.click').forEach((tr) => tr.addEventListener('click', () => formStk(l.find((x) => x.id === tr.dataset.id))));
            let righe = stkDati.raci.map((r) => ({ attivita: r.attivita, ruoli: { ...r.ruoli } }));
            if (!righe.length && dati) righe = (dati.gantt.milestone || []).map((m) => ({ attivita: m.nome, ruoli: {} }));
            const box = p.querySelector('#raciBox');
            const disegna = () => {
                if (!l.length) { box.innerHTML = '<div class="pm-vuoto">Aggiungi prima gli stakeholder: diventano le colonne della matrice.</div>'; return; }
                box.innerHTML = `<table class="raci"><thead><tr><th class="att">Attività / deliverable</th>${l.map((s) => `<th class="st" title="${esc(s.ruolo || '')}">${esc(s.nominativo)}</th>`).join('')}<th></th></tr></thead><tbody>
                    ${righe.map((r, i) => `<tr><td class="att"><input class="pm-input" data-att="${i}" value="${esc(r.attivita)}" placeholder="es. Analisi dei requisiti"></td>
                        ${l.map((s) => `<td class="${r.ruoli[s.id] || ''}"><select data-r="${i}" data-s="${esc(s.id)}"><option value=""></option>${['R', 'A', 'C', 'I'].map((v) => `<option ${r.ruoli[s.id] === v ? 'selected' : ''}>${v}</option>`).join('')}</select></td>`).join('')}
                        <td><button class="pm-btn piccolo pericolo" data-del="${i}" title="Togli la riga"><i class="fas fa-xmark"></i></button></td></tr>`).join('')}
                    </tbody></table>${righe.length ? '' : '<div class="pm-vuoto">Nessuna attività: premi «Attività».</div>'}`;
            };
            disegna();
            box.addEventListener('input', (e) => { if (e.target.dataset.att != null) righe[e.target.dataset.att].attivita = e.target.value; });
            box.addEventListener('change', (e) => {
                const s = e.target;
                if (s.dataset.r == null) return;
                const r = righe[s.dataset.r];
                if (s.value === 'A') Object.keys(r.ruoli).forEach((k) => { if (r.ruoli[k] === 'A' && k !== s.dataset.s) { r.ruoli[k] = 'R'; toast('Una sola «A» per attività: la precedente è diventata «R»'); } });
                if (s.value) r.ruoli[s.dataset.s] = s.value; else delete r.ruoli[s.dataset.s];
                disegna();
            });
            box.addEventListener('click', (e) => { const b = e.target.closest('[data-del]'); if (b) { righe.splice(Number(b.dataset.del), 1); disegna(); } });
            p.querySelector('#raciRiga').addEventListener('click', () => { righe.push({ attivita: '', ruoli: {} }); disegna(); box.querySelector(`[data-att="${righe.length - 1}"]`)?.focus(); });
            p.querySelector('#raciSalva').addEventListener('click', async (e) => {
                e.currentTarget.disabled = true;
                try { await api('/raci', { metodo: 'PUT', corpo: { projectId, righe: righe.filter((r) => r.attivita.trim()) } }); toast('Matrice RACI salvata'); }
                catch (err) { toast(err.message, 'errore'); } finally { e.currentTarget.disabled = false; }
            });
        }
        async function formStk(x) {
            const nuovo = !x.id;
            const sola = !nuovo && x.puoModificare === false;
            const m = modale({
                titolo: `<i class="fas fa-user"></i> ${nuovo ? 'Nuovo stakeholder' : esc(x.nominativo)}`,
                corpo: `<div class="pm-form">
                    <label>Organizzazione<select name="organizzazione">${Object.entries(ORG).map(([k, v]) => `<option value="${k}" ${k === (x.organizzazione || 'cliente') ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
                    <label></label>
                    <label class="largo">Nominativo<input name="nominativo" value="${esc(x.nominativo || '')}" list="stkProposte" autocomplete="off"><span class="pm-nota" id="stkFonte" style="font-weight:400"></span></label>
                    <datalist id="stkProposte"></datalist>
                    <label>Email<input name="email" value="${esc(x.email || '')}"></label>
                    <label>Ruolo nel progetto<input name="ruolo" value="${esc(x.ruolo || '')}" list="stkRuoli" autocomplete="off" placeholder="Scegli dall'elenco o scrivi il ruolo"></label>
                    <datalist id="stkRuoli"></datalist>
                    <label>Influenza sul progetto<select name="influenza">${opzioni15(x.influenza, ['minima', 'bassa', 'media', 'alta', 'decisiva'])}</select></label>
                    <label>Interesse per il progetto<select name="interesse">${opzioni15(x.interesse, ['minimo', 'basso', 'medio', 'alto', 'massimo'])}</select></label>
                    <label class="largo">Strategia (come gestirlo, cosa gli sta a cuore)<textarea name="strategia">${esc(x.strategia || '')}</textarea></label>
                    <label class="largo">Comunicazione (canale e frequenza)<input name="comunicazione" value="${esc(x.comunicazione || '')}" placeholder="es. SAL mensile, email settimanale"></label></div>`,
                pulsanti: [
