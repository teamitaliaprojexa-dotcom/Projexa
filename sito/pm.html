                    ...(!nuovo && !sola ? [{ testo: '<i class="fas fa-trash"></i> Elimina', classe: 'pericolo', azione: async () => { if (!confirm('Togliere questo stakeholder?')) return false; await api(`/stakeholder/${x.id}?projectId=${encodeURIComponent(projectId)}`, { metodo: 'DELETE' }); toast('Tolto'); caricaStakeholder(); } }] : []),
                    { testo: 'Annulla' },
                    ...(!sola ? [{ testo: '<i class="fas fa-floppy-disk"></i> Salva', classe: 'primario', azione: async (mm) => {
                        const v = { ...valori(mm), projectId };
                        if (!v.nominativo.trim()) throw new Error('Il nominativo è obbligatorio');
                        if (nuovo) await api('/stakeholder', { metodo: 'POST', corpo: v }); else await api(`/stakeholder/${x.id}`, { metodo: 'PUT', corpo: v });
                        toast('Stakeholder salvato'); caricaStakeholder();
                    } }] : [])
                ]
            });
            if (sola) { m.querySelectorAll('input, select, textarea').forEach((el) => { el.disabled = true; }); return; }
            // L'Organizzazione decide da dove arrivano i nominativi proposti: Cliente = Contatti del
            // cliente del progetto, Interno = rubrica (prima il team del Kick-off), Fornitore = a mano.
            // Si può sempre scrivere un nominativo che non è nell'elenco.
            const selOrg = m.querySelector('[name="organizzazione"]');
            const inNome = m.querySelector('[name="nominativo"]');
            const elenco = m.querySelector('#stkProposte');
            const fonteTxt = m.querySelector('#stkFonte');
            const SEGNAPOSTO = { cliente: 'Scegli tra i contatti del cliente o scrivi il nominativo', interno: 'Scegli dalla rubrica o scrivi il nominativo', fornitore: 'Scrivi il nominativo' };
            // Ruoli tipici proposti per «Ruolo nel progetto», secondo l'Organizzazione (testo libero ammesso).
            const RUOLI = {
                cliente: ['Sponsor', 'Referente di progetto del cliente', 'Key user', 'Utente finale', 'Referente IT', 'Responsabile HR', 'Responsabile amministrazione', 'Ufficio acquisti', 'Direzione', 'DPO / Privacy'],
                interno: ['Project Manager', 'Consulente applicativo', 'Consulente tecnico', 'Sviluppatore', 'Account / Commerciale', 'Formatore', 'Supporto / Help desk', 'Responsabile di area'],
                fornitore: ['Referente del fornitore', 'Consulente esterno', 'Partner tecnologico', 'Subappaltatore']
            };
            let prop = [];
            async function caricaProposte() {
                const fonte = selOrg.value;
                m.querySelector('#stkRuoli').innerHTML = (RUOLI[fonte] || []).map((r) => `<option value="${esc(r)}"></option>`).join('');
                inNome.placeholder = SEGNAPOSTO[fonte] || '';
                prop = [];
                elenco.innerHTML = '';
                fonteTxt.textContent = '';
                if (fonte === 'fornitore') return;
                try {
                    prop = await api(`/stakeholder/proposte?projectId=${encodeURIComponent(projectId)}&fonte=${encodeURIComponent(fonte)}`);
                    elenco.innerHTML = prop.map((c) => `<option value="${esc(c.nominativo)}">${esc([c.ruolo, c.email, c.team ? 'nel team' : ''].filter(Boolean).join(' · '))}</option>`).join('');
                    fonteTxt.textContent = prop.length ? '' : (fonte === 'cliente' ? 'Il cliente non ha contatti: scrivi il nominativo (oppure aggiungili nella sezione Contatti della scheda cliente).' : 'Nessun contatto in rubrica: scrivi il nominativo.');
                } catch (e) { /* proposte facoltative: si scrive a mano */ }
            }
            selOrg.addEventListener('change', caricaProposte);
            inNome.addEventListener('change', () => {
                const c = prop.find((y) => y.nominativo === inNome.value);
                if (!c) return;
                if (!m.querySelector('[name="email"]').value) m.querySelector('[name="email"]').value = c.email;
                if (!m.querySelector('[name="ruolo"]').value) m.querySelector('[name="ruolo"]').value = c.ruolo;
            });
            caricaProposte();
        }

        // ================= CHIUSURA =================
        let chDati = null;
        async function caricaChiusura() {
            const p = pannello('chiusura');
            p.innerHTML = attesa('Carico i dati di chiusura…');
            try { chDati = await api(`/chiusura?projectId=${encodeURIComponent(projectId)}`); renderChiusura(p); } catch (e) { p.innerHTML = errore(e); }
        }
        function renderChiusura(p) {
            const c = chDati.chiusura || {};
            const sola = chDati.chiusura && chDati.chiusura.puoModificare === false;
            const lez = (x, mie) => `<div class="lezione ${x.tipo}"${mie ? ` data-id="${esc(x.id)}"` : ''}><div class="meta">${x.tipo === 'positivo' ? '<i class="fas fa-thumbs-up" style="color:#059669"></i> Ha funzionato' : '<i class="fas fa-wrench" style="color:#B45309"></i> Da migliorare'}${x.categoria ? ` · ${esc(x.categoria)}` : ''}${!mie && x.progetto ? ` · progetto ${esc(x.progetto)}` : ''}
                ${mie && x.puoModificare !== false ? ' · <a href="#" data-del-lez="' + esc(x.id) + '">elimina</a>' : ''}</div><div>${esc(x.testo)}</div>${x.raccomandazione ? `<div class="pm-nota"><i class="fas fa-arrow-right"></i> ${esc(x.raccomandazione)}</div>` : ''}</div>`;
            p.innerHTML = `${chDati.tabelle ? '' : sqlMancante()}
                <div class="pm-griglia">
                    <div class="pm-card">
                        <h2><i class="fas fa-flag-checkered"></i> Chiusura del progetto</h2>
                        ${sola ? '<div class="pm-avviso">Sola lettura per il tuo ruolo.</div>' : ''}
                        <div class="pm-form" id="formCh">
                            <label>Accettazione del cliente (data)<input type="date" name="data_accettazione" value="${esc(c.data_accettazione || '')}"></label>
                            <label>Accettato da<input name="accettato_da" value="${esc(c.accettato_da || '')}"></label>
                            <label class="largo">Soddisfazione del cliente<span class="stelle" id="stelle">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-v="${n}" class="${c.soddisfazione >= n ? 'on' : ''}" title="${n} su 5"><i class="fas fa-star"></i></button>`).join('')}</span><input type="hidden" name="soddisfazione" value="${c.soddisfazione || ''}"></label>
                            <label class="largo">Nota sulla soddisfazione<textarea name="nota_soddisfazione" style="min-height:50px">${esc(c.nota_soddisfazione || '')}</textarea></label>
                            <label class="largo">Obiettivi raggiunti<textarea name="obiettivi_raggiunti">${esc(c.obiettivi_raggiunti || '')}</textarea></label>
                            <label class="largo">Attività residue e passaggio al supporto<textarea name="attivita_residue">${esc(c.attivita_residue || '')}</textarea></label>
                        </div>
                        <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.9rem">
                            <button class="pm-btn primario" id="salvaCh" ${sola ? 'disabled' : ''}><i class="fas fa-floppy-disk"></i> Salva</button>
                            <button class="pm-btn" id="verbale"><i class="fas fa-file-signature"></i> Verbale di chiusura</button>
                        </div>
                        <p class="pm-nota">Il progetto si chiude poi con il pulsante arancione «Chiudi Progetto» della scheda.</p>
                    </div>
                    <div class="pm-card">
                        <h2><i class="fas fa-graduation-cap"></i> Lessons learned</h2>
                        <div class="pm-form">
                            <label>Tipo<select class="pm-input" id="lezTipo"><option value="migliorare">Da migliorare</option><option value="positivo">Ha funzionato</option></select></label>
                            <label>Categoria<select class="pm-input" id="lezCat"><option value="">–</option>${['Pianificazione', 'Cliente', 'Team', 'Tecnica', 'Commerciale', 'Comunicazione', 'Qualità', 'Fornitori'].map((x) => `<option>${x}</option>`).join('')}</select></label>
                            <label class="largo">Cosa è successo<textarea class="pm-input" id="lezTesto" style="min-height:55px"></textarea></label>
                            <label class="largo">Raccomandazione per i prossimi progetti<input class="pm-input" id="lezRacc"></label>
                        </div>
                        <button class="pm-btn piccolo primario" id="lezAggiungi" style="margin:0.6rem 0 0.9rem"><i class="fas fa-plus"></i> Aggiungi lezione</button>
                        ${chDati.lessons.length ? chDati.lessons.map((x) => lez(x, true)).join('') : '<div class="pm-vuoto">Nessuna lezione registrata. Si possono scrivere anche durante il progetto.</div>'}
                    </div>
                    <div class="pm-card">
                        <h2><i class="fas fa-book-open"></i> Dai progetti simili</h2>
                        <p class="pm-nota" style="margin-top:0">Lezioni dei tuoi altri progetti con tipologia «${esc(chDati.tipologia || '–')}»: rileggile all'avvio.</p>
                        ${chDati.simili.length ? chDati.simili.map((x) => lez(x, false)).join('') : '<div class="pm-vuoto">Nessuna lezione dai progetti con la stessa tipologia.</div>'}
                    </div>
                </div>`;
            const form = p.querySelector('#formCh');
            if (sola) form.querySelectorAll('input, textarea').forEach((el) => { el.disabled = true; });
            p.querySelector('#stelle').addEventListener('click', (e) => {
                const b = e.target.closest('button'); if (!b || sola) return;
                const v = Number(b.dataset.v);
                form.querySelector('[name="soddisfazione"]').value = v;
                p.querySelectorAll('#stelle button').forEach((x) => x.classList.toggle('on', Number(x.dataset.v) <= v));
            });
            p.querySelector('#salvaCh').addEventListener('click', async (e) => {
                e.currentTarget.disabled = true;
                try { await api('/chiusura', { metodo: 'PUT', corpo: { ...valori(form), projectId } }); toast('Dati di chiusura salvati'); }
                catch (err) { toast(err.message, 'errore'); } finally { e.currentTarget.disabled = false; }
            });
            p.querySelector('#verbale').addEventListener('click', () => sceltaDocumento('chiusura'));
            p.querySelector('#lezAggiungi').addEventListener('click', async (e) => {
                const testo = p.querySelector('#lezTesto').value.trim();
                if (!testo) { toast('Scrivi la lezione appresa', 'errore'); return; }
                e.currentTarget.disabled = true;
                try {
                    await api('/lesson', { metodo: 'POST', corpo: { projectId, tipo: p.querySelector('#lezTipo').value, categoria: p.querySelector('#lezCat').value, testo, raccomandazione: p.querySelector('#lezRacc').value } });
                    toast('Lezione aggiunta'); caricaChiusura();
                } catch (err) { toast(err.message, 'errore'); e.currentTarget.disabled = false; }
            });
            p.querySelectorAll('[data-del-lez]').forEach((a) => a.addEventListener('click', async (e) => {
                e.preventDefault();
                if (!confirm('Eliminare questa lezione?')) return;
                try { await api(`/lesson/${a.dataset.delLez}?projectId=${encodeURIComponent(projectId)}`, { metodo: 'DELETE' }); caricaChiusura(); } catch (err) { toast(err.message, 'errore'); }
            }));
        }

        // ================= CHIEDI AL PROGETTO =================
        const storia = [];
        function caricaChiedi() {
            const p = pannello('chiedi');
            p.innerHTML = `<div class="pm-card" style="max-width:980px">
                <h2><i class="fas fa-comments"></i> Chiedi al progetto</h2>
                <p class="pm-nota" style="margin-top:0">L'AI risponde usando i dati del progetto: scheda, salute, budget, Gantt, rischi, decisioni, Change Request, azioni, issue e i recap delle ultime riunioni. Serve un'AI con chiave API (Impostazioni › AI).</p>
                <div class="pm-chat" id="chat"></div>
                <div class="pm-suggerimenti" id="sugg">${['Perché il progetto è in questo stato?', 'Siamo nel budget? Quanto manca a finire?', 'Cosa abbiamo deciso nelle ultime riunioni?', 'Quali sono le azioni scadute e di chi sono?', 'Quali rischi devo affrontare questa settimana?', 'Cosa devo chiedere al cliente?'].map((s) => `<button type="button">${esc(s)}</button>`).join('')}</div>
                <div class="pm-chat-in"><textarea id="domanda" placeholder="Scrivi una domanda sul progetto… (Invio per inviare, Maiusc+Invio per andare a capo)"></textarea><button class="pm-btn primario" id="invia"><i class="fas fa-paper-plane"></i></button></div>
            </div>`;
            const chat = p.querySelector('#chat'), dom = p.querySelector('#domanda'), btn = p.querySelector('#invia');
            const aggiungi = (ruolo, html) => { const d = document.createElement('div'); d.className = `pm-msg ${ruolo}`; d.innerHTML = html; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; };
            aggiungi('ai', 'Ciao! Chiedimi qualsiasi cosa su questo progetto.');
            async function invia(testo) {
                const q = String(testo || dom.value).trim();
                if (!q) return;
                dom.value = '';
                aggiungi('io', esc(q));
                const att = aggiungi('ai', '<i class="fas fa-spinner fa-spin"></i> Sto guardando i dati del progetto…');
                btn.disabled = true;
                try {
                    const r = await api('/chiedi', { metodo: 'POST', corpo: { projectId, domanda: q, storia }, ai: 'pm_chiedi', titolo: dati && dati.progetto ? dati.progetto.nome : '' });
                    if (r.batch) { att.innerHTML = `<i class="fas fa-hourglass-half"></i> ${esc(r.messaggio)}`; return; }
                    att.innerHTML = `<div class="pm-ai">${testoAiHtml(r.risposta)}</div><small>${esc(r.ai)}</small>`;
                    storia.push({ ruolo: 'io', testo: q }, { ruolo: 'ai', testo: r.risposta });
                } catch (e) { att.innerHTML = `<span style="color:#DC2626">${esc(e.message)}</span>`; }
                finally { btn.disabled = false; dom.focus(); }
            }
            btn.addEventListener('click', () => invia());
            dom.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); invia(); } });
            p.querySelector('#sugg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) invia(b.textContent); });
        }

        // ================= BRIEFING E DOCUMENTI =================
        document.getElementById('btnBriefing').addEventListener('click', () => apriBriefing());
        async function apriBriefing(idCalendar) {
            const m = modale({ titolo: '<i class="fas fa-clipboard-list"></i> Briefing pre-riunione', larga: true, corpo: attesa('L\'AI prepara il briefing con azioni aperte, rischi, decisioni e ultimo recap…'), pulsanti: [{ testo: 'Chiudi' }] });
            try {
                const r = await api('/briefing', { metodo: 'POST', corpo: { projectId, id_calendar: idCalendar && idCalendar !== '1' ? idCalendar : undefined }, ai: 'pm_briefing', titolo: dati && dati.progetto ? dati.progetto.nome : '' });
                if (r.batch) { m.querySelector('.pm-modal-body').innerHTML = `<div class="pm-nota"><i class="fas fa-hourglass-half"></i> ${esc(r.messaggio)}</div>`; return; }
                m.querySelector('.pm-modal-body').innerHTML = `<div class="pm-ai">${testoAiHtml(r.briefing)}</div><p class="pm-nota" style="margin-top:1rem">${esc(r.ai)}</p>`;
                const foot = m.querySelector('.pm-modal-foot');
                const copia = document.createElement('button');
                copia.className = 'pm-btn'; copia.innerHTML = '<i class="fas fa-copy"></i> Copia';
                copia.addEventListener('click', async () => { await navigator.clipboard.writeText(r.briefing); toast('Briefing copiato'); });
                foot.prepend(copia);
            } catch (e) { m.querySelector('.pm-modal-body').innerHTML = errore(e); }
        }
        document.getElementById('btnStatus').addEventListener('click', () => sceltaDocumento('status'));

        function sceltaDocumento(tipo) {
            const oggi = new Date();
            const dal = new Date(oggi.getTime() - 14 * 86400000).toISOString().slice(0, 10);
            const titolo = tipo === 'status' ? 'Status Report (SAL)' : 'Verbale di chiusura';
            modale({
                titolo: `<i class="fas fa-file-lines"></i> ${titolo}`,
                corpo: `${tipo === 'status' ? `<label class="pm-form" style="display:block"><span style="font-size:0.8rem;font-weight:600">Periodo: dal</span><input type="date" class="pm-input" id="docDal" value="${dal}" style="max-width:200px"></label>` : ''}
                    <p class="pm-nota">L'AI scrive il commento; numeri, tabelle, rischi, milestone e Change Request li mette Projexa.</p>
                    <div style="display:grid; gap:0.7rem; margin-top:0.6rem">
                        <div class="pm-card" style="margin:0"><b><i class="fas fa-print"></i> Anteprima da stampare o salvare in PDF</b><div class="pm-nota">Si apre in una nuova scheda.</div></div>
                        <div class="pm-card" style="margin:0"><b><i class="fas fa-file-word" style="color:#2563EB"></i> Su un tuo template Word (.docx)</b><div class="pm-nota">L'AI compila il template come per l'Offerta economica. Il file non resta su Projexa.</div>
                            <input type="file" id="docTpl" accept=".docx" style="margin-top:0.5rem"></div>
                    </div>`,
                pulsanti: [{ testo: 'Annulla' },
                    { testo: '<i class="fas fa-file-word"></i> Genera Word', azione: async (mm) => {
                        const f = mm.querySelector('#docTpl').files[0];
                        if (!f) throw new Error('Scegli il template .docx');
                        if (!/\.docx$/i.test(f.name)) throw new Error('Il template deve essere un file .docx');
                        const dalV = mm.querySelector('#docDal')?.value || '';
                        const sc = await ProjexaAi.scegli('pm_docx', { apiUrl: PM.API_URL, headers: PM.auth });
                        if (!sc) return false;
                        mm.querySelector('.pm-modal-body').insertAdjacentHTML('beforeend', attesa('Genero il documento: può richiedere qualche minuto…'));
                        const qsDoc = ProjexaAi.inQuery({ projectId, tipo, dal: dalV }, sc, `${titolo} ${dati && dati.progetto ? dati.progetto.nome : ''}`.trim());
                        const r = await fetch(`${PM.API_URL}/pm/documento/docx?${qsDoc}`, { method: 'POST', headers: { ...PM.auth(), 'Content-Type': 'application/octet-stream' }, body: await f.arrayBuffer() });
                        if (r.status === 202) { const d = await r.json().catch(() => ({})); toast(d.messaggio || 'Documento inviato in modalità Batch'); return; }
                        if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || `Errore ${r.status}`); }
                        const nome = /filename\*=UTF-8''([^;]+)/.exec(r.headers.get('Content-Disposition') || '');
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(await r.blob());
                        a.download = nome ? decodeURIComponent(nome[1]) : `${titolo}.docx`;
                        a.click();
                        toast('Documento pronto');
                    } },
                    { testo: '<i class="fas fa-print"></i> Anteprima', classe: 'primario', azione: (mm) => {
                        const dalV = mm.querySelector('#docDal')?.value || '';
                        window.open(`pm-documento.html?${new URLSearchParams({ projectId, tipo, dal: dalV })}`, '_blank');
                    } }]
            });
        }

        // Tornando sul Cruscotto (dopo aver modificato una To-Do nella dashboard) la scheda RAID si
        // aggiorna, se è aperta e non c'è una finestra in corso.
        window.addEventListener('focus', () => {
            if (caricati.raid && pannello('raid').classList.contains('on') && !document.querySelector('.pm-modal-mask')) caricaRaid();
        });
        const CARICA = { panoramica: caricaPanoramica, raid: caricaRaid, cr: caricaCr, economia: caricaEconomia, stakeholder: caricaStakeholder, chiusura: caricaChiusura, chiedi: caricaChiedi };
        // Da una riunione (finestra del recap): progetto della riunione, scheda RAID, estrazione.
        if (!projectId && qs.get('da_riunione')) {
            api(`/riunione?id_calendar=${encodeURIComponent(qs.get('da_riunione'))}`)
                .then((r) => { location.replace(`pm.html?${new URLSearchParams({ projectId: r.projectId, tab: 'raid', estrai: qs.get('da_riunione') })}`); })
                .catch((e) => { pannello('panoramica').innerHTML = errore(e); });
            return;
        }
        if (!projectId) { pannello('panoramica').innerHTML = errore('Progetto non indicato: apri il Cruscotto PM dalla scheda del progetto.'); return; }
        caricati.panoramica = true;
        caricaPanoramica().then(() => {
            const t = qs.get('tab');
            if (t && t !== 'panoramica' && CARICA[t]) apriTab(t);
            if (qs.get('briefing')) apriBriefing(qs.get('briefing'));
        });
    })();
    </script>
</body>
