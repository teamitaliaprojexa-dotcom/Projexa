<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projexa - Capacità e risorse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/pm.css">
    <!--
      CAPACITÀ E ALLOCAZIONE DELLE RISORSE (2026-10-16) - FUNZIONE FACOLTATIVA: la voce «Capacità»
      del menu compare solo con Impostazioni › Preferenze › «Capacità e allocazione risorse» acceso.
      Schede: Copertura (prima vista: giornate da fare contro giornate coperte dalle allocazioni,
      per progetto e ruolo, con gli avvisi di incoerenza), Fabbisogno (per ruolo e mese, dai Costi Progetto: funziona anche senza persone),
      Carico persone (settimane; clic sul nome = assenze). Le persone e le allocazioni non hanno più una
      scheda propria: arrivano dai team dei progetti («Alloca tutti i team» nella Copertura, Cruscotto › Risorse),
      le ore settimanali dalla Rubrica.
      API: /api/pm/capacita* (backend/routes/pm.js, backend/config/capacita.js).
    -->
    <script src="js/azioni.js?v=20261017-2"></script>
</head>
<body>
    <div class="pm-top">
        <a class="pm-btn" href="dashboard.html"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <a class="pm-btn" id="tornaProgetto" style="display:none"><i class="fas fa-arrow-left"></i> Torna al progetto</a>
        <h1><i class="fas fa-people-group"></i> Capacità e risorse</h1>
        <span class="sub" id="sottotitolo"></span>
        <span class="spazio"></span>
        <label class="pm-nota">Orizzonte <select id="orizzonte" class="pm-input" style="width:auto; display:inline-block"><option value="3">3 mesi</option><option value="6" selected>6 mesi</option><option value="12">12 mesi</option></select></label>
        <a class="pm-btn" href="portfolio.html" id="vaiPortfolio"><i class="fas fa-layer-group"></i> Portfolio</a>
        <button class="pm-btn" id="aggiorna"><i class="fas fa-rotate"></i> Aggiorna</button>
    </div>
    <nav class="pm-tabs" id="tabs">
        <button class="pm-tab on" data-tab="copertura"><i class="fas fa-shield-halved"></i> Copertura</button>
        <button class="pm-tab" data-tab="fabbisogno"><i class="fas fa-chart-column"></i> Fabbisogno per ruolo</button>
        <button class="pm-tab" data-tab="carico"><i class="fas fa-table-cells"></i> Carico persone</button>
    </nav>
    <main class="pm-main">
        <div id="avvisi"></div>
        <section class="pm-pannello on" id="p-copertura"><div class="pm-attesa"><i class="fas fa-spinner fa-spin"></i> Calcolo la copertura dei tuoi progetti…</div></section>
        <section class="pm-pannello" id="p-fabbisogno"></section>
        <section class="pm-pannello" id="p-carico"></section>
    </main>
    <script src="js/pm-comune.js"></script>
    <script src="js/capacita-comune.js"></script>
    <script>
    (function () {
        const { esc, api, fmt, dataIt, toast, modale, valori } = PM;
        const { g, classeCarico, classeFabbisogno, meseIt, formAllocazione, attivaTooltip } = CapacitaUI;
        const qs = new URLSearchParams(location.search);
        const daProgetto = qs.get('da') || '';
        if (daProgetto) {
            const b = document.getElementById('tornaProgetto');
            b.href = `pm.html?projectId=${encodeURIComponent(daProgetto)}&tab=risorse`;
            b.style.display = '';
            document.getElementById('vaiPortfolio').href = `portfolio.html?da=${encodeURIComponent(daProgetto)}&tab=risorse`;
        }
        let dati = null;
        const chiusi = new Set(); // ruoli chiusi a mano nel fabbisogno (di default tutti aperti)
        const personeAperte = new Set(); // «ruolo|progetto» con le persone mostrate (icona davanti al progetto)
        // Interruttore «Raggruppa per progetto»: spento a ogni apertura della pagina.
        let perProgetto = false;
        const chiusiProg = new Set(); // progetti chiusi a mano nella vista per progetto
        const pannello = (id) => document.getElementById(`p-${id}`);
        const tabs = document.getElementById('tabs');
        function apriTab(nome) {
            tabs.querySelectorAll('.pm-tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === nome));
            document.querySelectorAll('.pm-pannello').forEach((p) => p.classList.toggle('on', p.id === `p-${nome}`));
            history.replaceState(null, '', `${location.pathname}?scheda=${nome}${daProgetto ? `&da=${encodeURIComponent(daProgetto)}` : ''}`);
        }
        tabs.addEventListener('click', (e) => { const b = e.target.closest('.pm-tab'); if (b) apriTab(b.dataset.tab); });

        async function carica() {
            pannello('copertura').innerHTML = '<div class="pm-attesa"><i class="fas fa-spinner fa-spin"></i> Calcolo la copertura dei tuoi progetti…</div>';
            try {
                dati = await api(`/capacita?mesi=${encodeURIComponent(document.getElementById('orizzonte').value)}`);
                render();
            } catch (e) {
                document.getElementById('avvisi').innerHTML = `<div class="pm-errore"><i class="fas fa-triangle-exclamation"></i> ${esc(e.message)}</div>`;
                document.querySelectorAll('.pm-pannello').forEach((p) => { p.innerHTML = ''; });
            }
        }
        function render() {
            document.getElementById('avvisi').innerHTML = dati.tabelle ? '' : '<div class="pm-avviso"><i class="fas fa-database"></i> Per salvare persone, assenze e allocazioni va eseguito lo script <b>Supporto/CreaDB/capacita_risorse.sql</b>. Il fabbisogno per ruolo funziona già.</div>';
            document.getElementById('sottotitolo').textContent = `${dati.carico.persone.length} persone · ${dati.allocazioni.filter((a) => a.al >= dati.fabbisogno.oggi).length} allocazioni · aggiornato al ${dataIt(dati.fabbisogno.oggi)}`;
            renderCopertura(); renderFabbisogno(); renderCarico();
        }

        // ================= COPERTURA (prima vista) =================
        // Per progetto e ruolo: giornate da pianificare contro giornate coperte dalle allocazioni,
        // mese per mese, e avvisi di incoerenza. Risponde a «sui miei progetti ho abbastanza
        // persone, nei mesi giusti?» senza bisogno di conoscere il resto della loro agenda.
        const copChiusi = new Set();      // progetti chiusi a mano
        const copPersone = new Set();     // «progetto|ruolo» con le persone aperte
        let copAvvisiTutti = false;
        let copAvvisiAperto = false; // «Da sistemare» chiuso di default (resta come lo lascia l'utente)
        function classeCop(fab, all) {
            if (fab < 0.05) return all > 0.05 ? 'cop-extra' : 'cop-vuoto';
            const r = all / fab;
            return r >= 0.95 ? 'cop-ok' : r >= 0.5 ? 'cop-parz' : 'cop-ko';
        }
        // Tooltip della cella: mese, giorni lavorativi, da fare, coperte per persona, esito, come si calcola.
        function tipCop(v, m, r, c) {
            const gm = (c.giorniMese || {})[m];
            const nomeMese = new Date(`${m}-01T12:00:00Z`).toLocaleDateString('it-IT', { month: 'long', year: 'numeric', timeZone: 'UTC' });
            const righe = [`${r.ruolo} · ${nomeMese}${gm != null ? ` (${gm} giorni lavorativi${m === c.mesi[0] ? ' da oggi' : ''})` : ''}`];
            righe.push(`Da fare: ${g(v.fab)} gg`);
            righe.push(`Coperte: ${g(v.all)} gg${v.fab > 0.05 ? ` (${Math.round((v.all / v.fab) * 100)}%)` : ''}`);
            const chi = (r.persone || []).filter((x) => x.perMese && x.perMese[m] > 0.001);
            chi.forEach((x) => righe.push(`• ${x.nominativo}: ${x.perc}% di ${g(x.oreSett)} h/sett → ${g(x.perMese[m])} gg`));
            if (!chi.length && v.all <= 0.001) righe.push('• nessuna persona allocata in questo mese');
            const diff = v.all - v.fab;
            righe.push(Math.abs(diff) < 0.05 ? '= Coperto' : diff < 0 ? `= Mancano ${g(-diff)} gg` : `= In più ${g(diff)} gg`);
            righe.push(`ℹ Da fare = giornate da pianificare del ruolo (${g(r.daPianificare)} gg) distribuite sui giorni lavorativi da oggi alla fine del progetto${r.fine ? ` (${dataIt(r.fine)})` : ''}. Coperte = % allocata × ore settimanali della persona ÷ 5 ÷ 8 per ogni giorno lavorativo (festività e assenze escluse). Verde dal 95%.`);
            return righe.join('\n');
        }
        function cellaCop(v, m, r, c) {
            const cl = classeCop(v.fab, v.all);
            if (cl === 'cop-vuoto') return '<td class="cop cop-vuoto">–</td>';
            const perc = v.fab > 0.05 ? Math.min(100, Math.round((v.all / v.fab) * 100)) : 100;
            return `<td class="cop ${cl}" data-tip="${esc(tipCop(v, m, r, c))}">
                <div class="cop-num"><b>${g(v.all)}</b><span>/ ${g(v.fab)}</span></div><div class="cop-bar"><i style="width:${perc}%"></i></div></td>`;
        }
        function renderCopertura() {
            const c = dati.copertura;
            const box = pannello('copertura');
            if (!c) { box.innerHTML = '<div class="pm-vuoto">Copertura non disponibile.</div>'; return; }
            const t = c.totali;
            const percTot = t.daPianificare > 0 ? Math.round((Math.min(t.coperto, t.daPianificare) / t.daPianificare) * 100) : 100;
            const ICONE = { alta: 'fa-circle-exclamation', media: 'fa-triangle-exclamation', bassa: 'fa-circle-info' };
            const avvisi = copAvvisiTutti ? c.avvisi : c.avvisi.slice(0, 8);
            const nCol = 4 + c.mesi.length;
            const righe = c.progetti.map((p) => {
                const aperto = !copChiusi.has(p.projectId);
                const percP = p.daPianificare > 0 ? Math.round((p.coperto / p.daPianificare) * 100) : 100;
                const sub = aperto ? p.ruoli.map((r) => {
                    const kp = `${p.projectId}|${r.chiave}`;
                    const pers = copPersone.has(kp);
                    // Una riga per persona: le sue allocazioni (anche più periodi, es. dal piano del
                    // Gantt) come etichette in ordine di data, ognuna cliccabile per modificarla.
                    const perPersona = [];
                    for (const x of r.persone) {
                        let y = perPersona.find((q) => q.nominativo === x.nominativo);
                        if (!y) { y = { nominativo: x.nominativo, giornate: 0, all: [] }; perPersona.push(y); }
                        y.giornate += x.giornate || 0; y.all.push(x);
                    }
                    const persone = pers ? (perPersona.length ? perPersona.map((y) => `<tr class="azc-pers pm-nota"><td style="padding-left:3.4rem"><i class="fas fa-user" style="color:#9CA3AF; width:14px"></i> ${esc(y.nominativo)}</td>
                            <td class="cap-cell"></td><td class="cap-cell">${g(y.giornate)}</td><td class="cap-cell"></td>
                            <td colspan="${c.mesi.length}"><div class="cop-periodi">${y.all.sort((a, b) => a.dal.localeCompare(b.dal)).map((x) => `<span class="cop-periodo click" data-cop-all="${esc(x.id)}" data-tip="${esc(`${x.perc}% dal ${dataIt(x.dal)} al ${dataIt(x.al)} · ${g(x.giornate)} gg${(() => {
                                // Fasi del Gantt della persona in questo periodo (calcolate dal server).
                                const FN = { analisi: 'Analisi', configurazione: 'Configurazione', formazione: 'Formazione', programmazione: 'Programmazione' };
                                if ((x.attivita || []).length) return `\nDeve fare:${x.attivita.map((a) => `\n• ${FN[a.fase] || a.fase}${a.moduli.length ? `: ${a.moduli.join(', ')}` : ''}`).join('')}`;
                                if (/^Piano dal Gantt/i.test(String(x.note || ''))) return '\nℹ Nessuna fase con date in questo periodo: ore delle fasi senza date nel Gantt';
                                return x.note ? `\n${x.note}` : '';
                            })()}\nℹ Clic per modificare`)}"><b>${x.perc}%</b> ${esc(dataIt(x.dal).slice(0, 5))} → ${esc(dataIt(x.al).slice(0, 5))}</span>`).join('')}</div></td></tr>`).join('')
                        : `<tr class="pm-nota"><td colspan="${nCol}" style="padding-left:3.4rem; color:#9CA3AF">Nessuna persona allocata: usa «Alloca tutti i team» in alto o la scheda Risorse del Cruscotto del progetto.</td></tr>`) : '';
                    return `<tr class="pm-nota"><td style="padding-left:1.8rem"><button type="button" class="cap-pers-btn" data-cop-pers="${esc(kp)}" title="Persone allocate (${new Set(r.persone.map((x) => x.nominativo)).size})"><i class="fas fa-user-group"></i> <small>${new Set(r.persone.map((x) => x.nominativo)).size}</small></button> ${esc(r.ruolo)}</td>
                        <td class="cap-cell">${g(r.daPianificare)}</td><td class="cap-cell">${g(r.coperto)}</td>
                        <td class="cap-cell">${r.scoperto >= 0.05 ? `<span class="cop-mancano">${g(r.scoperto)}</span>` : '<span class="cop-okt"><i class="fas fa-check"></i></span>'}</td>
                        ${c.mesi.map((m) => cellaCop(r.perMese[m], m, r, c)).join('')}</tr>${persone}`;
                }).join('') : '';
                return `<tr class="click cop-prog" data-cop-prog="${esc(p.projectId)}"><td><i class="fas fa-chevron-${aperto ? 'down' : 'right'}" style="width:12px; color:#9CA3AF"></i> <a href="pm.html?projectId=${encodeURIComponent(p.projectId)}&tab=risorse"><b>${esc(p.cliente ? `${p.cliente} · ` : '')}${esc(p.nome)}</b></a>
                        <div class="cop-prog-bar" title="Coperto ${percP}%"><i style="width:${Math.min(100, percP)}%" class="${percP >= 95 ? 'ok' : percP >= 50 ? 'parz' : 'ko'}"></i></div><div class="pm-nota">${p.fine ? `fine ${dataIt(p.fine)} · ` : ''}coperto ${percP}%</div></td>
                    <td class="cap-cell"><b>${g(p.daPianificare)}</b></td><td class="cap-cell"><b>${g(p.coperto)}</b></td>
                    <td class="cap-cell">${p.scoperto >= 0.05 ? `<span class="cop-mancano forte">${g(p.scoperto)}</span>` : '<span class="cop-okt"><i class="fas fa-check"></i></span>'}</td>
                    <td colspan="${c.mesi.length}"></td></tr>${sub}`;
            }).join('');
            box.innerHTML = `<div class="cop-kpi">
                    <div><small>Da pianificare</small><b>${g(t.daPianificare)}</b><span>giornate nei progetti aperti</span></div>
                    <div><small>Coperte</small><b>${g(Math.min(t.coperto, t.daPianificare))}</b><span>dalle allocazioni</span></div>
                    <div class="${t.scoperto >= 0.5 ? 'ko' : 'ok'}"><small>Scoperte</small><b>${g(t.scoperto)}</b><span>${t.scoperto >= 0.5 ? 'servono persone' : 'tutto coperto'}</span></div>
                    <div><small>Copertura</small><b>${percTot}%</b><span class="cop-prog-bar grande"><i style="width:${percTot}%" class="${percTot >= 95 ? 'ok' : percTot >= 50 ? 'parz' : 'ko'}"></i></span></div>
                </div>
                ${c.avvisi.length ? `<details class="pm-card cop-dasist" id="copDaSistemare"${copAvvisiAperto ? ' open' : ''}><summary><h2><i class="fas fa-chevron-right cop-freccia"></i><i class="fas fa-bell"></i> Da sistemare <span class="pill">${c.avvisi.length}</span></h2></summary>
                    <ul class="cop-avvisi">${avvisi.map((a) => `<li class="${a.gravita}"><i class="fas ${ICONE[a.gravita]}"></i> <span>${esc(a.testo)}</span></li>`).join('')}</ul>
                    ${c.avvisi.length > 8 ? `<button type="button" class="pm-btn piccolo" id="copAvvisiTutti">${copAvvisiTutti ? 'Mostra meno' : `Mostra tutti (${c.avvisi.length})`}</button>` : ''}</details>` : ''}
                <div class="pm-card">
                    <h2><i class="fas fa-shield-halved"></i> Copertura per progetto e ruolo <span class="azioni"><button class="pm-btn piccolo primario" id="copAllocaTeam" title="Proponi le allocazioni per le persone dei team (Kick-off) dei progetti con giornate da fare: le controlli e le salvi"><i class="fas fa-file-import"></i> Alloca tutti i team</button></span></h2>
                    <p class="pm-nota" style="margin-top:0">Per ogni progetto e ruolo: giornate <b>da pianificare</b> (Stima − Consuntivo dei Costi Progetto) contro giornate <b>coperte</b> dalle allocazioni (da oggi, festività e assenze escluse). Nei mesi: <b>coperte / da fare</b>, verde se coperte, arancione se in parte, rosso se scoperte. Prima i progetti con più giornate scoperte. Non serve conoscere il resto dell'agenda delle persone. Clic sull'icona delle persone per vedere chi è allocato, clic su una persona per cambiarne percentuale e periodo.</p>
                    ${c.progetti.length ? `<div class="cop-legenda"><span class="es"><b>7,9</b><span>/ 7,8</span></span> = giornate <b>coperte</b> / giornate <b>da fare</b> nel mese · <span style="color:#059669">■</span> coperte · <span style="color:#D97706">■</span> in parte · <span style="color:#DC2626">■</span> scoperte · <span style="color:#3B82F6">■</span> allocate senza giornate da fare · passa sopra una cella per il dettaglio</div><div class="pm-scroll"><table class="pm-t cap-fissa cop-tab"><thead><tr><th>Progetto / ruolo</th><th class="n" data-tip="Da pianificare\nGiornate ancora da fare = Stima − Consuntivo dei Costi Progetto (ore Qlik, non il fatturato), per ruolo.">Da pianificare</th><th class="n" data-tip="Coperte\nGiornate coperte dalle allocazioni da oggi alla loro fine: % allocata × ore settimanali della persona ÷ 5 ÷ 8 per ogni giorno lavorativo.\nℹ Nel totale del progetto si contano al massimo le giornate da fare di ogni ruolo.">Coperte</th><th class="n" data-tip="Scoperte\nDa pianificare − Coperte: giornate per cui non c’è ancora nessuno allocato.\nℹ Il segno ✓ vuol dire che il ruolo è coperto.">Scoperte</th>${c.mesi.map((m) => `<th class="n" data-tip="${esc(meseIt(m))}\nIn ogni cella: giornate coperte / giornate da fare nel mese.${(c.giorniMese || {})[m] != null ? `\n${c.giorniMese[m]} giorni lavorativi${m === c.mesi[0] ? ' da oggi' : ''}` : ''}">${esc(meseIt(m))}</th>`).join('')}</tr></thead><tbody>${righe}</tbody></table></div>`
                        : '<div class="pm-vuoto">Nessuna giornata da pianificare nei progetti aperti.</div>'}
                </div>`;
            attivaTooltip(box);
            box.querySelector('#copAvvisiTutti')?.addEventListener('click', () => { copAvvisiTutti = !copAvvisiTutti; renderCopertura(); });
            box.querySelector('#copDaSistemare')?.addEventListener('toggle', (e) => { copAvvisiAperto = e.currentTarget.open; });
            box.querySelector('#copAllocaTeam')?.addEventListener('click', proposteAllocazioni);
            box.querySelectorAll('[data-cop-all]').forEach((tr) => tr.addEventListener('click', () => {
                const x = dati.allocazioni.find((a) => a.id === tr.dataset.copAll);
                if (x) formAllocazione({ x, risorse: dati.risorse, progetti: dati.progetti, onSalvato: carica });
            }));
            box.querySelectorAll('[data-cop-pers]').forEach((b) => b.addEventListener('click', (e) => {
                e.stopPropagation(); const k = b.dataset.copPers; if (copPersone.has(k)) copPersone.delete(k); else copPersone.add(k); renderCopertura();
            }));
            box.querySelectorAll('tr[data-cop-prog]').forEach((tr) => tr.addEventListener('click', (e) => {
                if (e.target.closest('a')) return;
                const k = tr.dataset.copProg; if (copChiusi.has(k)) copChiusi.delete(k); else copChiusi.add(k); renderCopertura();
            }));
        }

        // ================= FABBISOGNO PER RUOLO =================
        function renderFabbisogno() {
            const f = dati.fabbisogno;
            const cap = new Map((dati.carico.ruoli || []).map((r) => [r.chiave, r]));
            const conPersone = dati.carico.persone.length > 0;
            const tot = (o) => Object.values(o).reduce((s, v) => s + v, 0);
            // Colonne: Stima, Consuntivo (ore spese da Qlik, non il fatturato), Da pianificare =
            // Stima - Consuntivo, poi come si distribuisce nei mesi, Oltre l'orizzonte e Senza date.
            const conSenzaDate = f.ruoli.some((r) => r.senzaDate > 0);
            const num = (v, forte = false) => `<td class="cap-cell">${v ? (forte ? `<b>${g(v)}</b>` : g(v)) : '–'}</td>`;
            const nCol = 4 + f.mesi.length + 1 + (conSenzaDate ? 1 : 0);
            // Persone del team del progetto con quel ruolo (icona davanti alla riga): consuntivo
            // in giornate e allocazioni in corso o future.
            const righePersone = (p, rientro = '3.4rem') => {
                if (!p.persone.length) return `<tr class="pm-nota"><td colspan="${nCol}" style="padding-left:${rientro}; color:#9CA3AF">Nessuna persona del team con questo ruolo: aggiungila nel team (Kick-off) del progetto.</td></tr>`;
                return p.persone.map((x) => `<tr class="pm-nota azc-pers"><td style="padding-left:${rientro}"><i class="fas fa-user" style="color:#9CA3AF; width:14px"></i> ${esc(x.nominativo)}</td>
                    <td class="cap-cell"></td><td class="cap-cell" title="Giornate già spese (ore Qlik / 8)">${x.consuntivo ? g(x.consuntivo) : '–'}</td>
                    <td colspan="${nCol - 3}" style="color:${x.allocazioni.length ? '#065F46' : '#9CA3AF'}">${x.allocazioni.length ? `<i class="fas fa-user-clock"></i> ${x.allocazioni.map((a) => `${a.perc}% dal ${dataIt(a.dal)} al ${dataIt(a.al)}`).join(' · ')}` : 'non allocata'}</td></tr>`).join('');
            };
            const cellePiccole = (o) => `${f.mesi.map((m) => `<td class="cap-cell">${o.perMese[m] ? g(o.perMese[m]) : ''}</td>`).join('')}<td class="cap-cell">${o.oltre ? g(o.oltre) : ''}</td>${conSenzaDate ? `<td class="cap-cell">${o.senzaDate ? g(o.senzaDate) : ''}</td>` : ''}`;
            const btnPersone = (kp, n) => `<button type="button" class="cap-pers-btn" data-pers="${esc(kp)}" title="${personeAperte.has(kp) ? 'Nascondi' : 'Mostra'} le persone del progetto con questo ruolo (${n})"><i class="fas fa-user-group"></i> <small>${n}</small></button>`;
            const linkProgetto = (p) => `<a href="pm.html?projectId=${encodeURIComponent(p.projectId)}&tab=risorse">${esc(p.cliente ? `${p.cliente} · ` : '')}${esc(p.nome)}</a>${p.motivo ? ` <span class="pill" title="${esc(p.motivo)}">senza date</span>` : ''}`;

            // Vista PER RUOLO (predefinita): ruolo, sotto i suoi progetti.
            const righePerRuolo = () => f.ruoli.map((r) => {
                const c = cap.get(r.chiave);
                const celle = f.mesi.map((m) => {
                    const fab = r.perMese[m] || 0;
                    const capM = c ? c.capacita[m] : null;
                    const allM = c ? c.allocato[m] : null;
                    return `<td class="cap-cell ${classeFabbisogno(fab, capM)}" title="${c ? `Fabbisogno ${g(fab)} gg · capacità ${g(capM)} gg · già allocate ${g(allM)} gg` : `Fabbisogno ${g(fab)} giornate`}"><span class="cap-g">${fab ? g(fab) : '–'}</span>${c ? `<small>cap. ${g(capM)}</small>` : ''}</td>`;
                }).join('');
                const espanso = !chiusi.has(r.chiave);
                const dett = espanso ? r.progetti.map((p) => {
                    const kp = `${r.chiave}|${p.projectId}`;
                    return `<tr class="pm-nota"><td style="padding-left:1.8rem">${btnPersone(kp, p.persone.length)} ${linkProgetto(p)}</td>
                    ${num(p.stima)}${num(p.consuntivo)}${num(p.daPianificare, true)}${cellePiccole(p)}</tr>${personeAperte.has(kp) ? righePersone(p) : ''}`;
                }).join('') : '';
                return `<tr class="click" data-ruolo="${esc(r.chiave)}"><td><i class="fas fa-chevron-${espanso ? 'down' : 'right'}" style="width:12px; color:#9CA3AF"></i> <b>${esc(r.ruolo)}</b>${c ? `<div class="pm-nota">${c.persone} person${c.persone === 1 ? 'a' : 'e'}</div>` : ''}</td>
                    ${num(r.stima)}${num(r.consuntivo)}<td class="cap-cell" style="background:#EEF2FF"><b>${g(r.daPianificare)}</b></td>
                    ${celle}<td class="cap-cell">${r.oltre ? g(r.oltre) : '–'}</td>${conSenzaDate ? `<td class="cap-cell" style="${r.senzaDate ? 'color:#B45309; font-weight:600' : ''}">${r.senzaDate ? g(r.senzaDate) : '–'}</td>` : ''}</tr>${dett}`;
            }).join('');

            // Vista PER PROGETTO (interruttore acceso): progetto con i totali, sotto i suoi ruoli.
            const righePerProgetto = () => {
                const progetti = new Map();
                for (const r of f.ruoli) for (const p of r.progetti) {
                    if (!progetti.has(p.projectId)) progetti.set(p.projectId, { projectId: p.projectId, nome: p.nome, cliente: p.cliente, motivo: p.motivo, stima: 0, consuntivo: 0, daPianificare: 0, oltre: 0, senzaDate: 0, perMese: Object.fromEntries(f.mesi.map((m) => [m, 0])), ruoli: [] });
                    const x = progetti.get(p.projectId);
                    ['stima', 'consuntivo', 'daPianificare', 'oltre', 'senzaDate'].forEach((k) => { x[k] += p[k] || 0; });
                    f.mesi.forEach((m) => { x.perMese[m] += p.perMese[m] || 0; });
                    x.ruoli.push({ ...p, ruolo: r.ruolo, chiave: r.chiave });
                }
                const lista = [...progetti.values()].sort((a, b) => String(a.cliente).localeCompare(String(b.cliente), 'it') || String(a.nome).localeCompare(String(b.nome), 'it'));
                return lista.map((x) => {
                    const espanso = !chiusiProg.has(x.projectId);
                    const dett = espanso ? x.ruoli.map((p) => {
                        const kp = `${p.chiave}|${p.projectId}`;
                        return `<tr class="pm-nota"><td style="padding-left:1.8rem">${btnPersone(kp, p.persone.length)} ${esc(p.ruolo)}</td>
                        ${num(p.stima)}${num(p.consuntivo)}${num(p.daPianificare, true)}${cellePiccole(p)}</tr>${personeAperte.has(kp) ? righePersone(p) : ''}`;
                    }).join('') : '';
                    return `<tr class="click" data-progetto="${esc(x.projectId)}"><td><i class="fas fa-chevron-${espanso ? 'down' : 'right'}" style="width:12px; color:#9CA3AF"></i> <b>${linkProgetto(x)}</b><div class="pm-nota">${x.ruoli.length} ruol${x.ruoli.length === 1 ? 'o' : 'i'}</div></td>
                        ${num(x.stima)}${num(x.consuntivo)}<td class="cap-cell" style="background:#EEF2FF"><b>${g(x.daPianificare)}</b></td>
                        ${f.mesi.map((m) => `<td class="cap-cell" style="background:#F9FAFB">${x.perMese[m] ? g(x.perMese[m]) : '–'}</td>`).join('')}<td class="cap-cell">${x.oltre ? g(x.oltre) : '–'}</td>${conSenzaDate ? `<td class="cap-cell" style="${x.senzaDate ? 'color:#B45309; font-weight:600' : ''}">${x.senzaDate ? g(x.senzaDate) : '–'}</td>` : ''}</tr>${dett}`;
                }).join('');
            };
            const righe = perProgetto ? righePerProgetto() : righePerRuolo();
            const somma = (k) => f.ruoli.reduce((s, r) => s + (r[k] || 0), 0);
            pannello('fabbisogno').innerHTML = `<div class="pm-card">
                <h2><i class="fas fa-chart-column"></i> Giornate da pianificare per ${perProgetto ? 'progetto' : 'ruolo'} e mese
                    <span class="azioni"><span class="cap-seg${perProgetto ? ' destra' : ''}" role="radiogroup" aria-label="Raggruppa le righe">
                        <button type="button" role="radio" aria-checked="${!perProgetto}" class="${perProgetto ? '' : 'on'}" data-vista="ruolo" title="Righe per ruolo con sotto i progetti (e la capacità)"><i class="fas fa-user-tag"></i> Per ruolo</button>
                        <button type="button" role="radio" aria-checked="${perProgetto}" class="${perProgetto ? 'on' : ''}" data-vista="progetto" title="Righe per progetto con sotto i ruoli"><i class="fas fa-diagram-project"></i> Per progetto</button>
                    </span></span></h2>
                <p class="pm-nota" style="margin-top:0">Dai <b>Costi Progetto</b> dei tuoi progetti aperti, in giornate (progetti a ore: 8 ore = 1 giornata): <b>Stima</b> = effort venduto, <b>Consuntivo</b> = effort già speso (ore Qlik, non il fatturato), <b>Da pianificare</b> = Stima − Consuntivo. I mesi mostrano come il «Da pianificare» si distribuisce sui giorni lavorativi da oggi alla fine del progetto (campo End, altrimenti la fine del Gantt); <b>Oltre</b> = dopo l'orizzonte scelto${conSenzaDate ? '; <b>Senza date</b> = progetti senza data di fine o con la fine superata, da ripianificare' : ''}. Il ruolo è la voce di costo del tenant (Configurazione gruppi Billing) con lo stesso codice di fatturazione della voce del progetto. ${conPersone ? 'Sotto ogni mese la <b>capacità</b> delle persone con quel ruolo (ore settimanali della Rubrica, festività e assenze già tolte): rosso = servono più giornate di quante ne hai.' : 'Alloca le persone dei team (Copertura › «Alloca tutti i team») per vedere la capacità accanto al fabbisogno: senza persone questa vista funziona comunque.'} Clic sul ruolo per chiudere o riaprire i suoi progetti.</p>
                ${f.ruoli.length ? `<div class="pm-scroll"><table class="pm-t cap-fissa"><thead><tr><th>${perProgetto ? 'Progetto / ruolo' : 'Ruolo (voce di costo)'}</th><th class="n">Stima</th><th class="n" title="Effort già speso (ore Qlik), non il fatturato">Consuntivo</th><th class="n" title="Stima − Consuntivo">Da pianificare</th>${f.mesi.map((m) => `<th class="n">${esc(meseIt(m))}</th>`).join('')}<th class="n" title="Giornate dopo l'orizzonte scelto">Oltre</th>${conSenzaDate ? '<th class="n" title="Progetti senza data di fine o con la fine già superata">Senza date</th>' : ''}</tr></thead><tbody>${righe}
                    <tr><td><b>Totale</b></td>${num(somma('stima'), true)}${num(somma('consuntivo'), true)}${num(somma('daPianificare'), true)}${f.mesi.map((m) => `<td class="cap-cell"><b>${g(f.ruoli.reduce((s, r) => s + (r.perMese[m] || 0), 0))}</b></td>`).join('')}${num(somma('oltre'), true)}${conSenzaDate ? num(somma('senzaDate'), true) : ''}</tr>
                    </tbody></table></div>` : '<div class="pm-vuoto">Nessuna giornata da pianificare: nei progetti aperti il consuntivo ha già raggiunto la stima, oppure mancano i Costi Progetto.</div>'}
                ${(f.progettiEsauriti || []).length ? `<p class="pm-nota"><b>${f.progettiEsauriti.length} progetti con il consuntivo già pari o oltre la stima</b> (niente da pianificare): ${f.progettiEsauriti.map((p) => `${esc(`${p.cliente ? `${p.cliente} · ` : ''}${p.nome}`)} <span title="${esc(p.voci.map((v) => `${v.voce}: consuntivo ${g(v.consuntivo)} su stima ${g(v.stima)} gg`).join('\n'))}" style="cursor:help">ⓘ</span>`).join(', ')}</p>` : ''}
                ${f.progettiSenzaVoci.length ? `<p class="pm-nota"><b>${f.progettiSenzaVoci.length} progetti senza Costi Progetto</b> (non contano nel fabbisogno): ${f.progettiSenzaVoci.slice(0, 15).map((p) => esc(`${p.cliente ? `${p.cliente} · ` : ''}${p.nome}`)).join(', ')}${f.progettiSenzaVoci.length > 15 ? '…' : ''}</p>` : ''}
                ${f.errori.length ? `<p class="pm-nota" style="color:#B91C1C">Non calcolati: ${esc(f.errori.join('; '))}</p>` : ''}
            </div>`;
            pannello('fabbisogno').querySelectorAll('[data-pers]').forEach((b) => b.addEventListener('click', (e) => {
                e.stopPropagation();
                const k = b.dataset.pers; if (personeAperte.has(k)) personeAperte.delete(k); else personeAperte.add(k); renderFabbisogno();
            }));
            pannello('fabbisogno').querySelectorAll('tr[data-ruolo]').forEach((tr) => tr.addEventListener('click', () => {
                const k = tr.dataset.ruolo; if (chiusi.has(k)) chiusi.delete(k); else chiusi.add(k); renderFabbisogno();
            }));
            pannello('fabbisogno').querySelectorAll('tr[data-progetto]').forEach((tr) => tr.addEventListener('click', (e) => {
                if (e.target.closest('a')) return; // il nome apre il Cruscotto
                const k = tr.dataset.progetto; if (chiusiProg.has(k)) chiusiProg.delete(k); else chiusiProg.add(k); renderFabbisogno();
            }));
            pannello('fabbisogno').querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => {
                const nuovo = b.dataset.vista === 'progetto';
                if (nuovo === perProgetto) return;
                perProgetto = nuovo;
                // Prima scorre il cursore, poi si ridisegna la tabella.
                b.parentElement.classList.toggle('destra', perProgetto);
                b.parentElement.querySelectorAll('button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); });
                setTimeout(renderFabbisogno, 240);
            }));
        }

        // ================= CARICO PERSONE =================
        // Filtro della colonna Persona: di default solo chi ha giornate allocate nelle settimane mostrate.
        let soloCoinvolte = true;
        function renderCarico() {
            const c = dati.carico;
            const nomeProg = (id) => c.nomiProgetti[id] || 'Progetto';
            const coinvolte = c.persone.filter((p) => p.settimane.some((s) => s.allocato > 0));
            const lista = soloCoinvolte ? coinvolte : c.persone;
            const filtro = `<button type="button" class="cap-pers-btn" id="filtroCarico" title="${soloCoinvolte ? `Mostrate solo le persone con giornate allocate nel periodo (${coinvolte.length} su ${c.persone.length}): clic per vederle tutte` : 'Mostrate tutte le persone: clic per vedere solo quelle coinvolte'}" style="${soloCoinvolte ? 'background:#EEF2FF; border-color:#A5B4FC' : ''}"><i class="fas fa-filter"></i>${soloCoinvolte ? ' coinvolte' : ''}</button>`;
            // Colore: ore allocate da TUTTO il tenant (tue + altri PM) contro le ore disponibili della persona.
            const classe = (s) => {
                if (s.oreDisp <= 0 && s.oreTot <= 0) return s.assenze ? 'assente' : 'zero';
                if (s.sovra) return 'alto';
                if (s.oreTot <= 0) return 'zero';
                return s.carico != null && s.carico >= 80 ? 'medio' : 'basso';
            };
            const settAllerta = new Set();
            lista.forEach((p) => p.settimane.forEach((s) => { if (s.sovra) settAllerta.add(s.dal); }));
            const conAltri = lista.some((p) => p.conAltri);
            pannello('carico').innerHTML = `<div class="pm-card">
                <h2><i class="fas fa-table-cells"></i> Carico delle persone per settimana</h2>
                <p class="pm-nota" style="margin-top:0">Giornate allocate a ogni persona settimana per settimana (stesso orizzonte scelto in alto): le tue in grassetto, quelle degli <b style="color:#6D28D9">altri PM del tenant</b> sulla stessa persona (stessa email) in viola. La disponibilità viene dalle <b>ore lavorate a settimana</b> della Rubrica (32 h se non indicate), ridotte nelle settimane con festività o assenze; anche le percentuali allocate si calcolano su quelle ore. Il colore confronta il totale di tutto il tenant con le ore disponibili: <b style="color:#B91C1C">⚠</b> = la persona supera le sue ore nella settimana. Passa sopra una cella per il dettaglio, clic sul nome per le <b>assenze</b>.</p>
                <div class="cap-legenda" style="margin-bottom:0.6rem"><span><i style="background:#D1FAE5"></i>sotto l'80%</span><span><i style="background:#FDE68A"></i>80-100%</span><span><i style="background:#FCA5A5; box-shadow: inset 0 0 0 2px #DC2626"></i>oltre le ore della persona ⚠</span><span><i style="background:repeating-linear-gradient(45deg,#E5E7EB,#E5E7EB 4px,#F9FAFB 4px,#F9FAFB 8px)"></i>assente</span><span><b>1 gg</b> = tue allocazioni</span><span style="color:#6D28D9"><b>+2 gg</b> = altri PM${conAltri ? '' : ' (al momento nessuna)'}</span></div>
                ${c.persone.length ? `<div class="pm-scroll"><table class="pm-t cap-heat cap-fissa cap-tenant"><thead><tr><th>Persona ${filtro}</th>${c.settimane.map((s) => `<th class="n${settAllerta.has(s) ? ' w-alert' : ''}" title="Settimana dal ${dataIt(s)}${settAllerta.has(s) ? ': almeno una persona supera le sue ore' : ''}">${esc(dataIt(s).slice(0, 5))}</th>`).join('')}</tr></thead><tbody>
                    ${lista.length ? '' : `<tr><td colspan="${c.settimane.length + 1}" class="pm-vuoto">Nessuna persona con giornate allocate nel periodo: clic sul filtro accanto a «Persona» per vederle tutte (${c.persone.length}).</td></tr>`}
                    ${lista.map((p) => `<tr><td><button type="button" class="cap-nome" data-ass-pers="${esc(p.id)}" title="Assenze di ${esc(p.nominativo)} (ferie, permessi…)"><b>${esc(p.nominativo)}</b> <i class="far fa-calendar-xmark"></i></button>${p.settimaneSovra ? `<span class="cap-flag" title="Supera le sue ore in ${p.settimaneSovra} settimane, sommando le allocazioni di tutti i PM del tenant"><i class="fas fa-triangle-exclamation"></i> ${p.settimaneSovra} sett.</span>` : ''}
                        <div class="pm-nota">${esc(p.ruolo || 'senza ruolo')}</div>
                        <span class="cap-ore" title="${p.oreDaRubrica ? 'Ore lavorate a settimana dalla Rubrica' : 'Persona non trovata in Rubrica (stessa email): 32 h a settimana'}"><i class="far fa-clock"></i> ${fmt(p.oreSett, 1)} h/sett${p.oreDaRubrica ? '' : ' *'}</span></td>
                        ${p.settimane.map((s) => {
                            const cl = classe(s);
                            const tit = [`Settimana dal ${dataIt(s.dal)}${s.assenze ? ` (${s.assenze} giorni di assenza)` : ''}`,
                                `Disponibili: ${g(s.oreDisp)} h (${fmt(p.oreSett, 1)} h/sett)`,
                                `Tue allocazioni: ${g(s.allocato)} gg = ${g(s.allocato * 8)} h`,
                                ...Object.entries(s.progetti).map(([id, v]) => `   • ${nomeProg(id)}: ${g(v)} gg`),
                                s.altri > 0 ? `Altri PM: ${g(s.altri)} gg = ${g(s.altri * 8)} h` : 'Altri PM: nessuna allocazione',
                                ...Object.entries(s.altriDett || {}).map(([k, v]) => `   • ${k}: ${g(v)} gg`),
                                `Totale tenant: ${g(s.oreTot)} h su ${g(s.oreDisp)} h${s.carico != null ? ` (${fmt(s.carico, 0)}%)` : ''}${s.sovra ? ' ⚠ SOVRACCARICO' : ''}`].join('\n');
                            const txt = cl === 'assente' ? 'assente'
                                : s.oreTot > 0 ? `${s.allocato > 0 ? `<span class="mie">${g(s.allocato)} gg</span>` : '<span class="mie">–</span>'}${s.altri > 0 ? `<span class="altri">+${g(s.altri)} gg altri</span>` : ''}<span class="tot">${g(s.oreTot)}/${g(s.oreDisp)} h</span>`
                                : '–';
                            return `<td class="h ${cl}" title="${esc(tit)}">${txt}</td>`;
                        }).join('')}</tr>`).join('')}
                    </tbody></table></div>` : '<div class="pm-vuoto">Nessuna persona allocata: usa «Alloca tutti i team» nella scheda <b>Copertura</b> (o il Cruscotto PM › Risorse).</div>'}
            </div>`;
            pannello('carico').querySelector('#filtroCarico')?.addEventListener('click', () => { soloCoinvolte = !soloCoinvolte; renderCarico(); });
            pannello('carico').querySelectorAll('[data-ass-pers]').forEach((b) => b.addEventListener('click', () => finestraAssenze(b.dataset.assPers)));
        }

        // ================= ASSENZE (clic sul nome nel Carico) =================
        // Ferie, permessi…: la persona risulta «non disponibile» in quei giorni (Carico e Copertura).
        function finestraAssenze(id) {
            const r = dati.risorse.find((x) => x.id === id) || dati.carico.persone.find((x) => x.id === id);
            if (!r) return;
            const sola = r.puoModificare === false;
            const assL = dati.assenze.filter((a) => a.risorsa_id === id && a.al >= dati.fabbisogno.oggi).sort((a, b) => a.dal.localeCompare(b.dal));
            const riapri = async (m) => { m.remove(); await carica(); finestraAssenze(id); };
            const m = modale({
                titolo: `<i class="far fa-calendar-xmark"></i> Assenze di ${esc(r.nominativo)}`,
                corpo: `${sola ? '<div class="pm-avviso">Sola lettura.</div>' : ''}
                    ${assL.length ? `<table class="pm-t"><tbody>${assL.map((a) => `<tr><td>${dataIt(a.dal)}${a.al !== a.dal ? ` → ${dataIt(a.al)}` : ''}</td><td>${esc(a.nota || '')}</td><td class="n">${sola ? '' : `<button type="button" class="pm-btn piccolo pericolo" data-del-ass="${esc(a.id)}" title="Togli l'assenza"><i class="fas fa-trash"></i></button>`}</td></tr>`).join('')}</tbody></table>` : '<div class="pm-nota">Nessuna assenza da oggi in avanti.</div>'}
                    ${sola ? '' : `<div style="display:flex; gap:0.5rem; align-items:flex-end; flex-wrap:wrap; margin-top:0.8rem">
                        <label class="pm-nota">Dal<input type="date" class="pm-input" data-ass-dal></label><label class="pm-nota">Al<input type="date" class="pm-input" data-ass-al></label>
                        <label class="pm-nota" style="flex:1">Nota (facoltativa)<input class="pm-input" data-ass-nota placeholder="es. ferie"></label>
                        <button type="button" class="pm-btn piccolo primario" data-add-ass><i class="fas fa-plus"></i> Aggiungi</button></div>`}
                    <p class="pm-nota">Nei giorni di assenza la persona non è disponibile: il Carico e la Copertura ne tengono conto. La nota è facoltativa.</p>`,
                pulsanti: [{ testo: 'Chiudi' }]
            });
            m.querySelector('[data-add-ass]')?.addEventListener('click', async () => {
                const dal = m.querySelector('[data-ass-dal]').value, al = m.querySelector('[data-ass-al]').value || dal;
                if (!dal) { toast('Indica la data di inizio dell\'assenza', 'errore'); return; }
                if (al < dal) { toast('La fine non può essere prima dell\'inizio', 'errore'); return; }
                try { await api('/capacita/assenze', { metodo: 'POST', corpo: { risorsa_id: id, dal, al, nota: m.querySelector('[data-ass-nota]').value } }); toast('Assenza aggiunta'); await riapri(m); }
                catch (e) { toast(e.message, 'errore'); }
            });
            m.querySelectorAll('[data-del-ass]').forEach((b) => b.addEventListener('click', async () => {
                try { await api(`/capacita/assenze/${encodeURIComponent(b.dataset.delAss)}`, { metodo: 'DELETE' }); toast('Assenza tolta'); await riapri(m); }
                catch (e) { toast(e.message, 'errore'); }
            }));
        }

        // Proposte dai team dei progetti: una riga per persona e progetto, % e date modificabili.
        async function proposteAllocazioni() {
            let d;
            try { d = await api('/capacita/proposte-allocazioni'); } catch (e) { toast(e.message, 'errore'); return; }
            const s = d.saltate || {};
            const note = [s.giaAllocate ? `${s.giaAllocate} già allocate` : '', s.senzaFine ? `${s.senzaFine} su progetti senza data di fine valida (campo End o Gantt)` : '', s.ruoloSenzaEffort ? `${s.ruoloSenzaEffort} con un ruolo senza giornate da fare nel progetto` : ''].filter(Boolean);
            if (!d.proposte.length) { toast(`Nessuna allocazione da proporre${note.length ? `: ${note.join(', ')}` : ': nessuna persona nei team (Kick-off) dei progetti con giornate da fare'}`, 'errore'); return; }
            modale({
                titolo: '<i class="fas fa-file-import"></i> Alloca tutti i team',
                larga: true,
                corpo: `<p class="pm-nota" style="margin-top:0">Persone del team (Kick-off) dei progetti con giornate ancora da fare, con il loro ruolo nel progetto. La percentuale è una stima: giornate da fare per il ruolo della persona, divise tra i colleghi del team con lo stesso ruolo, sui giorni disponibili fino alla fine del progetto. Correggi e spunta quelle da salvare.${note.length ? `<br>Non proposte: ${esc(note.join('; '))}.` : ''}</p>
                    <div class="pm-scroll" style="max-height:440px"><table class="pm-t"><thead><tr><th><input type="checkbox" data-tutte checked title="Tutte"></th><th>Persona</th><th>Progetto</th><th class="n">Giornate</th><th>%</th><th>Dal</th><th>Al</th></tr></thead><tbody>
                    ${d.proposte.map((x, i) => `<tr><td><input type="checkbox" data-i="${i}" checked></td><td><b>${esc(x.nominativo)}</b><div class="pm-nota">${esc(x.ruolo)}</div></td>
                        <td>${esc(x.cliente ? `${x.cliente} · ` : '')}${esc(x.progetto)}</td>
                        <td class="n" title="Giornate da fare per il ruolo${x.colleghi > 1 ? `, divise tra ${x.colleghi} persone` : ''}">${g(x.giornate)}</td>
                        <td><input class="pm-input" type="number" min="1" max="100" style="width:72px" data-perc="${i}" value="${x.perc}"></td>
                        <td><input class="pm-input" type="date" data-dal="${i}" value="${esc(x.dal)}"></td>
                        <td><input class="pm-input" type="date" data-al="${i}" value="${esc(x.al)}"></td></tr>`).join('')}
                    </tbody></table></div>`,
                pulsanti: [{ testo: 'Annulla' }, { testo: '<i class="fas fa-floppy-disk"></i> Salva le selezionate', classe: 'primario', azione: async (mm) => {
                    const sel = [...mm.querySelectorAll('input[data-i]:checked')].map((c) => Number(c.dataset.i));
                    if (!sel.length) throw new Error('Spunta almeno una allocazione');
                    let fatte = 0;
                    for (const i of sel) {
                        const x = d.proposte[i];
                        const v = { perc: mm.querySelector(`[data-perc="${i}"]`).value, dal: mm.querySelector(`[data-dal="${i}"]`).value, al: mm.querySelector(`[data-al="${i}"]`).value };
                        // Persona non ancora tra le risorse: la crea il server insieme all'allocazione.
                        if (x.risorsa_id) await api('/capacita/allocazioni', { metodo: 'POST', corpo: { risorsa_id: x.risorsa_id, projectId: x.projectId, ...v, note: 'Dal team del progetto' } });
                        else await api('/capacita/progetto/alloca', { metodo: 'POST', corpo: { projectId: x.projectId, persone: [{ nominativo: x.nominativo, email: x.email, ruolo: x.ruolo, ...v }] } });
                        fatte += 1;
                    }
                    toast(`${fatte} allocazioni salvate`); carica();
                } }]
            }).querySelector('[data-tutte]').addEventListener('change', (e) => {
                e.target.closest('table').querySelectorAll('input[data-i]').forEach((c) => { c.checked = e.target.checked; });
            });
        }

        document.getElementById('aggiorna').addEventListener('click', carica);
        document.getElementById('orizzonte').addEventListener('change', carica);
        if (qs.get('scheda') && pannello(qs.get('scheda'))) apriTab(qs.get('scheda'));
        else if (qs.get('scheda')) apriTab('copertura'); // vecchie schede Risorse/Allocazioni
        carica();
    })();
    </script>
    <script src="js/chatbot.js"></script>
</body>
</html>
