                    ctx.font = '600 11px -apple-system, "Segoe UI", Roboto, sans-serif';
                    chart.data.datasets.forEach((ds, di) => {
                        const meta = chart.getDatasetMeta(di);
                        if (meta.hidden) return;
                        meta.data.forEach((el, k) => {
                            const v = Number(ds.data[k]);
                            if (!v) return;
                            const text = fmtNum(v);
                            let x, y;
                            if (single) {
                                ({ x, y } = el.tooltipPosition());
                                ctx.fillStyle = '#fff';
                                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            } else if (cfg.type === 'stacked') {
                                ({ x, y } = el.getCenterPoint());
                                ctx.fillStyle = '#fff';
                                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            } else if (cfg.type === 'barh') {
                                x = el.x + 4; y = el.y;
                                ctx.fillStyle = '#374151';
                                ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                            } else {
                                x = el.x; y = el.y - 4;
                                ctx.fillStyle = '#374151';
                                ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
                            }
                            ctx.fillText(text, x, y);
                        });
                    });
                    ctx.restore();
                }
            };
        }

        // Totale: somma dei valori VISIBILI (se nascondi una serie o una fetta dalla legenda il
        // totale si aggiorna). Scritto sotto il grafico; nella ciambella anche al centro.
        // Con più serie mostra anche il totale di ciascuna.
        function totalPlugin(cfg, footer) {
            const visibleTotals = (chart) => {
                const single = ['pie', 'doughnut', 'polar'].includes(cfg.type);
                return chart.data.datasets.map((ds, di) => {
                    if (!chart.isDatasetVisible(di)) return null;
                    const sum = ds.data.reduce((acc, v, k) => acc + ((single && !chart.getDataVisibility(k)) ? 0 : (Number(v) || 0)), 0);
                    return { label: ds.label, sum };
                }).filter(Boolean);
            };
            return {
                id: 'chartTotal',
                afterUpdate(chart) {
                    if (!footer) return;
                    const totals = visibleTotals(chart);
                    const all = totals.reduce((a, t) => a + t.sum, 0);
                    footer.innerHTML = `Totale: <strong>${esc(fmtNum(all))}</strong>`
                        + (totals.length > 1 ? `<span class="chart-total-parts">${totals.map(t => `${esc(t.label)}: ${esc(fmtNum(t.sum))}`).join(' · ')}</span>` : '');
                },
                afterDraw(chart) {
                    if (cfg.type !== 'doughnut') return;
                    const all = visibleTotals(chart).reduce((a, t) => a + t.sum, 0);
                    const meta = chart.getDatasetMeta(0);
                    const arc = meta && meta.data[0];
                    if (!arc) return;
                    const ctx = chart.ctx;
                    ctx.save();
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#6B7280'; ctx.font = '500 11px -apple-system, "Segoe UI", Roboto, sans-serif';
                    ctx.fillText('Totale', arc.x, arc.y - 11);
                    ctx.fillStyle = '#1E40AF'; ctx.font = '700 15px -apple-system, "Segoe UI", Roboto, sans-serif';
                    ctx.fillText(fmtNum(all), arc.x, arc.y + 8);
                    ctx.restore();
                }
            };
        }

        // Distrugge i grafici della pagina (non quello eventualmente aperto a schermo intero).
        function destroyCharts() {
            chartInstances.forEach((ch, key) => { if (key !== 'full') { ch.destroy(); chartInstances.delete(key); } });
        }
        function renderCharts() {
            updateChartsCount();
            const pane = document.getElementById('chartsPane');
            destroyCharts();
            const noTable = !gridColumns.length;
            pane.innerHTML = `<div class="charts-toolbar">
                    <span>${charts.length} grafic${charts.length === 1 ? 'o' : 'i'} · dati: ${visibleTable().rows.length} righe della Tabella (filtri inclusi)</span>
                    <button type="button" class="btn btn-sm btn-primary" id="chartAdd"${noTable ? ' disabled' : ''}><i class="fas fa-plus"></i> Nuovo grafico</button>
                </div>` + (noTable
                ? '<div class="state"><i class="fas fa-table"></i>Prima aggiungi delle colonne nella scheda Tabella: i grafici usano i suoi dati.</div>'
                : charts.length
                    ? `<div class="charts-grid">${charts.map((c, i) => `<div class="chart-card${c.wide ? ' wide' : ''}" data-chart-index="${i}">
                        <div class="chart-head"><h3 title="${esc(chartTitle(c))}">${esc(chartTitle(c))}</h3>
                            <button type="button" data-act="full" title="Schermo intero"><i class="fas fa-up-right-and-down-left-from-center"></i></button>
                            <button type="button" data-act="wide" title="${c.wide ? 'Riduci alla larghezza normale' : 'Allarga a tutta la riga'}"><i class="fas ${c.wide ? 'fa-compress' : 'fa-arrows-left-right'}"></i></button>
                            <button type="button" data-act="edit" title="Modifica"><i class="fas fa-pen"></i></button>
                            <button type="button" data-act="delete" title="Elimina"><i class="fas fa-trash"></i></button>
                        </div><div class="chart-box" id="chart-box-${i}"></div></div>`).join('')}</div>`
                    : '<div class="state"><i class="fas fa-chart-pie"></i>Nessun grafico: premi <strong>Nuovo grafico</strong>, scegli il tipo e le colonne.</div>');
            if (noTable) return;
            if (typeof Chart === 'undefined') {
                pane.querySelectorAll('.chart-box').forEach(b => { b.innerHTML = '<div class="chart-msg">Libreria grafici non disponibile: ricarica la pagina.</div>'; });
                return;
            }
            charts.forEach((cfg, i) => drawChart(cfg, document.getElementById(`chart-box-${i}`), i));
        }
        function chartTitle(c) {
            if (c.title) return c.title;
            const t = CHART_TYPES.find(x => x.id === c.type);
            const v = (c.values || [])[0];
            const what = v ? (v.agg === 'count' ? 'Conteggio' : `${AGGS.find(a => a.id === v.agg).label} ${labelOf(v.col) || ''}`) : '';
            const split = c.split && t && !t.noSplit && labelOf(c.split) ? ` e ${labelOf(c.split)}` : '';
            return `${what}${c.type === 'kpi' ? '' : ' per ' + (labelOf(c.category) || '?') + split} (${t ? t.label : ''})`;
        }
        function drawChart(cfg, box, i) {
            const d = chartData(cfg);
            if (d.error) { box.innerHTML = `<div class="chart-msg">${esc(d.error)}</div>`; return; }
            if (cfg.type === 'kpi') {
                const v = d.datasets[0] ? d.datasets[0].data[0] : 0;
                box.innerHTML = `<div class="kpi-box"><div class="kpi-value">${esc(fmtNum(v || 0))}</div><div class="kpi-label">${esc(d.datasets[0] ? d.datasets[0].label : '')}</div></div>`;
                return;
            }
            if (!d.labels.length) { box.innerHTML = '<div class="chart-msg">Nessun dato con i filtri attuali.</div>'; return; }
            box.innerHTML = '<div class="chart-canvas-wrap"><canvas></canvas></div>'
                + (cfg.total ? '<div class="chart-total"></div>' : '')
                + (d.truncated ? `<div class="chart-msg" style="padding:0.2rem;">Mostrate ${d.labels.length} categorie su ${d.truncated}</div>` : '');
            const single = ['pie', 'doughnut', 'polar'].includes(cfg.type);
            const type = { barh: 'bar', stacked: 'bar', area: 'line', polar: 'polarArea' }[cfg.type] || cfg.type;
            const datasets = d.datasets.map((ds, s) => {
                const color = PALETTE[s % PALETTE.length];
                if (single) return { ...ds, backgroundColor: d.labels.map((_, k) => PALETTE[k % PALETTE.length] + (cfg.type === 'polar' ? 'B3' : '')), borderColor: '#fff', borderWidth: 1 };
                if (type === 'line' || type === 'radar') {
                    return { ...ds, borderColor: color, backgroundColor: color + (cfg.type === 'area' || type === 'radar' ? '33' : ''), fill: cfg.type === 'area' || type === 'radar', tension: 0.25, pointRadius: 3 };
                }
                return { ...ds, backgroundColor: color, borderRadius: 4 };
            });
            const options = {
                responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { display: single || datasets.length > 1, position: single ? 'right' : 'top' },
                    tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmtNum(ctx.parsed && typeof ctx.parsed === 'object' ? (cfg.type === 'barh' ? ctx.parsed.x : (ctx.parsed.y ?? ctx.parsed.r)) : ctx.parsed)}` } }
                }
            };
            const showGrid = cfg.grid !== false;
            if (!single && type !== 'radar') {
                options.indexAxis = cfg.type === 'barh' ? 'y' : 'x';
                options.scales = {
                    x: { stacked: cfg.type === 'stacked', ticks: { autoSkip: true, maxRotation: 45 }, grid: { display: showGrid } },
                    y: { stacked: cfg.type === 'stacked', beginAtZero: true, grid: { display: showGrid } }
                };
            } else if (type === 'radar') {
                options.scales = { r: { beginAtZero: true, grid: { display: showGrid }, angleLines: { display: showGrid } } };
            }
            if (cfg.labels) {
                // Spazio per le etichette in cima/in fondo alle barre.
                options.layout = { padding: { top: 18, right: cfg.type === 'barh' ? 60 : 12 } };
            }
            chartInstances.set(i, new Chart(box.querySelector('canvas'), {
                type, data: { labels: d.labels, datasets }, options,
                plugins: [
                    ...(cfg.labels ? [valueLabelsPlugin(cfg)] : []),
                    ...(cfg.total ? [totalPlugin(cfg, box.querySelector('.chart-total'))] : [])
                ]
            }));
        }
        document.getElementById('chartsPane').addEventListener('click', (e) => {
            if (e.target.closest('#chartAdd')) { openChartModal(null); return; }
            const btn = e.target.closest('.chart-head button');
            if (!btn) return;
            const i = Number(btn.closest('.chart-card').dataset.chartIndex);
            if (btn.dataset.act === 'full') openChartFullscreen(i);
            else if (btn.dataset.act === 'edit') openChartModal(i);
            else if (btn.dataset.act === 'wide') { charts[i].wide = !charts[i].wide; saveCharts(); renderCharts(); }
            else if (btn.dataset.act === 'delete' && confirm('Eliminare questo grafico?')) { charts.splice(i, 1); saveCharts(); renderCharts(); }
        });

        // --- Schermo intero: il grafico si apre grande sopra la pagina (Esc o × per chiudere) ---
        let fullChart = null;
        function closeChartFullscreen() {
            if (fullChart) { fullChart.destroy(); fullChart = null; }
            const ov = document.getElementById('chartFullscreen');
            if (ov) ov.remove();
            chartInstances.delete('full');
        }
        function openChartFullscreen(i) {
            closeChartFullscreen();
            const cfg = charts[i];
            const ov = document.createElement('div');
            ov.id = 'chartFullscreen';
            ov.className = 'chart-fullscreen';
            ov.innerHTML = `<div class="cf-head"><h3>${esc(chartTitle(cfg))}</h3>
                    <button type="button" class="btn btn-sm" id="cfClose" title="Chiudi (Esc)"><i class="fas fa-xmark"></i> Chiudi</button></div>
                <div class="cf-box" id="cfBox"></div>`;
            document.body.appendChild(ov);
            ov.querySelector('#cfClose').addEventListener('click', closeChartFullscreen);
            ov.addEventListener('click', (e) => { if (e.target === ov) closeChartFullscreen(); });
            drawChart(cfg, ov.querySelector('#cfBox'), 'full');
            fullChart = chartInstances.get('full') || null;
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeChartFullscreen(); });

        // --- Finestra di configurazione ---
        let editingChart = null; // indice del grafico in modifica, null = nuovo
        let cfgType = 'bar';
        const modal = document.getElementById('chartModal');
        const colOptions = (selected, numericFirst) => gridColumns.map(c => {
            const id = colId(c);
            return `<option value="${esc(id)}"${id === selected ? ' selected' : ''}>${esc(AREAS[c.area].tag)} · ${esc(c.label)}</option>`;
        }).join('');
        function valueRowHtml(v) {
            return `<div class="val-row">
                <select class="agg">${AGGS.map(a => `<option value="${a.id}"${a.id === v.agg ? ' selected' : ''}>${a.label}</option>`).join('')}</select>
                <select class="col"${v.agg === 'count' ? ' disabled' : ''}>${colOptions(v.col)}</select>
                <button type="button" title="Togli questo valore" aria-label="Togli questo valore"><i class="fas fa-xmark"></i></button>
            </div>`;
        }
        function syncModalForType() {
            const t = CHART_TYPES.find(x => x.id === cfgType);
            document.querySelectorAll('#cfgTypes .chart-type').forEach(b => b.classList.toggle('selected', b.dataset.type === cfgType));
            document.getElementById('cfgCategoryWrap').hidden = !!t.noCategory;
            document.getElementById('cfgLimitWrap').hidden = !!t.noCategory;
            document.getElementById('cfgSplitWrap').hidden = !!t.noSplit;
            // Griglia: solo per i grafici con assi (non torta/ciambella/area polare/KPI).
            document.getElementById('cfgGridWrap').hidden = !!t.single;
            // Totale: il KPI è già un numero solo.
            document.getElementById('cfgTotalWrap').hidden = cfgType === 'kpi';
            // Torta, ciambella, area polare, KPI e "Dividi per" attivo: un solo valore.
            const splitOn = !t.noSplit && !!document.getElementById('cfgSplit').value;
            const oneValue = t.single || splitOn;
            document.getElementById('cfgSplitHint').hidden = !splitOn;
            const rows = [...document.querySelectorAll('#cfgValues .val-row')];
            rows.forEach((r, k) => { if (oneValue && k > 0) r.remove(); });
            document.getElementById('cfgAddValue').hidden = oneValue;
        }
        function openChartModal(index) {
            if (!gridColumns.length) return;
            editingChart = index;
            const c = index == null
                ? { type: 'bar', category: colId(gridColumns[0]), values: [{ agg: 'count', col: colId(gridColumns[0]) }], limit: 20 }
                : JSON.parse(JSON.stringify(charts[index]));
            cfgType = c.type;
            document.getElementById('chartModalTitle').textContent = index == null ? 'Nuovo grafico' : 'Modifica grafico';
            document.getElementById('cfgTitle').value = c.title || '';
            document.getElementById('cfgTypes').innerHTML = CHART_TYPES.map(t =>
                `<button type="button" class="chart-type" data-type="${t.id}"><i class="fas ${t.icon}"></i>${t.label}</button>`).join('');
            document.getElementById('cfgCategory').innerHTML = colOptions(c.category);
            document.getElementById('cfgSplit').innerHTML = '<option value="">— nessuna suddivisione —</option>' + colOptions(c.split || '');
            document.getElementById('cfgValues').innerHTML = (c.values && c.values.length ? c.values : [{ agg: 'count', col: colId(gridColumns[0]) }]).map(valueRowHtml).join('');
            document.getElementById('cfgLimit').value = String(c.limit == null ? 20 : c.limit);
            document.getElementById('cfgGrid').checked = c.grid !== false;
            document.getElementById('cfgLabels').checked = !!c.labels;
            document.getElementById('cfgTotal').checked = !!c.total;
            syncModalForType();
            modal.hidden = false;
        }
        function closeChartModal() { modal.hidden = true; }
        document.getElementById('cfgTypes').addEventListener('click', (e) => {
            const b = e.target.closest('.chart-type');
            if (b) { cfgType = b.dataset.type; syncModalForType(); }
        });
        document.getElementById('cfgSplit').addEventListener('change', syncModalForType);
        document.getElementById('cfgAddValue').addEventListener('click', () => {
            document.getElementById('cfgValues').insertAdjacentHTML('beforeend', valueRowHtml({ agg: 'sum', col: colId(gridColumns[gridColumns.length - 1]) }));
        });
        document.getElementById('cfgValues').addEventListener('change', (e) => {
            if (e.target.classList.contains('agg')) e.target.parentElement.querySelector('select.col').disabled = e.target.value === 'count';
        });
        document.getElementById('cfgValues').addEventListener('click', (e) => {
            const b = e.target.closest('button');
            if (b && document.querySelectorAll('#cfgValues .val-row').length > 1) b.closest('.val-row').remove();
        });
        document.getElementById('cfgCancel').addEventListener('click', closeChartModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeChartModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeChartModal(); });
        document.getElementById('cfgSave').addEventListener('click', () => {
            const cfg = {
                type: cfgType,
                title: document.getElementById('cfgTitle').value.trim(),
                category: document.getElementById('cfgCategory').value,
                split: CHART_TYPES.find(x => x.id === cfgType).noSplit ? '' : document.getElementById('cfgSplit').value,
                values: [...document.querySelectorAll('#cfgValues .val-row')].map(r => ({ agg: r.querySelector('.agg').value, col: r.querySelector('.col').value })),
                limit: Number(document.getElementById('cfgLimit').value) || 0,
                grid: document.getElementById('cfgGrid').checked,
                labels: document.getElementById('cfgLabels').checked,
                total: document.getElementById('cfgTotal').checked
            };
            if (editingChart != null) cfg.wide = charts[editingChart].wide;
            if (editingChart == null) charts.push(cfg); else charts[editingChart] = cfg;
            saveCharts();
            closeChartModal();
            renderCharts();
        });

        init().then(() => {
            if (document.getElementById('reportingSide').hidden) return;
            setCurrentReport(currentReport);
            markSelectedFields();
            updateChartsCount();
            if (gridColumns.length) loadGridData();
        });
    </script>
</body>
</html>
