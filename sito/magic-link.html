<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Projexa - Accesso con Magic link</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5; color: #374151;
        }
        .box { text-align: center; padding: 2rem; max-width: 420px; }
        .error { color: #B91C1C; }
        a { color: #3B82F6; }
    </style>
</head>
<body>
    <div class="box" id="box">Accesso in corso…</div>
    <script>
        // Link ricevuto via email (valido 60 secondi, monouso): il token si toglie subito
        // dalla barra degli indirizzi, si verifica con una POST e si salva la sessione come
        // dopo un login con email e password, poi si apre la dashboard.
        (async function () {
            const box = document.getElementById('box');
            const token = new URLSearchParams(location.search).get('token') || '';
            history.replaceState(null, '', location.pathname);
            try {
                if (!token) throw new Error('Link non valido.');
                const res = await fetch('/api/auth/magic-link/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.token) throw new Error(data.error || 'Accesso non riuscito.');
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user || {}));
                window.location.replace('dashboard.html');
            } catch (e) {
                box.className = 'box error';
                box.textContent = e.message + ' ';
                const a = document.createElement('a');
                a.href = 'login.html';
                a.textContent = 'Torna al login';
                box.appendChild(a);
            }
        })();
    </script>
</body>
</html>
